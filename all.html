<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنسيق النصوص</title>
    <style>
        :root {
            --nav-width: 80px;
            --bg-dark: #1a252f;
            --accent: #3498db;
            --text-light: #ecf0f1;
            
            --copy-primary: #2c3e50;
            --copy-secondary: #3498db;
            --copy-accent: #27ae60;
            --copy-bg: #f4f6f9;
            --copy-card-bg: #ffffff;
            --copy-text: #333;
            --bg: #f4f7fb;
            --surface: #ffffff;
            --surface-muted: #f8fafc;
            --border: #dbe3ee;
            --text: #172033;
            --muted: #667085;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --shadow: 0 18px 50px rgba(20, 30, 55, 0.12);
            --body-start: #f8fbff;
            --body-glow: rgba(37, 99, 235, 0.12);
            --workspace-bg: rgba(255, 255, 255, 0.86);
            --workspace-border: rgba(219, 227, 238, 0.9);
            --input-bg: #ffffff;
            --input-focus-bg: #fbfdff;
            --placeholder: #9aa6b2;
            --popover-bg: #ffffff;
        }
        body.dark-theme {
            --bg: #0f172a;
            --surface: #111827;
            --surface-muted: #172033;
            --border: #2d3b52;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --primary: #60a5fa;
            --primary-dark: #3b82f6;
            --success: #10b981;
            --danger: #f87171;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
            --body-start: #111827;
            --body-glow: rgba(96, 165, 250, 0.14);
            --workspace-bg: rgba(17, 24, 39, 0.9);
            --workspace-border: rgba(45, 59, 82, 0.92);
            --input-bg: #0f172a;
            --input-focus-bg: #111827;
            --placeholder: #6b7280;
            --popover-bg: #111827;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f6fa; height: 100vh; display: flex; overflow: hidden; }

        .app-nav { width: var(--nav-width); background: var(--bg-dark); height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20px; z-index: 1000; box-shadow: -2px 0 10px rgba(0,0,0,0.1); }
        .nav-btn { width: 50px; height: 50px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #95a5a6; transition: all 0.3s ease; position: relative; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }
        .nav-tooltip { position: absolute; right: 60px; background: #2c3e50; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; opacity: 0; pointer-events: none; transition: 0.2s; white-space: nowrap; }
        .nav-btn:hover .nav-tooltip { opacity: 1; right: 70px; }
        .nav-icon { width: 24px; height: 24px; }

        .app-content { flex: 1; position: relative; overflow: hidden; }
        .view-panel { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #fff; }
        .view-panel.active { display: block; }
        .formatting-page-frame {
            width: 100%;
            height: 100%;
            display: block;
            border: 0;
            background: var(--bg);
        }
        #view-formatting > .fmt-wrapper {
            display: none;
        }

        .app-copyright {
            position: fixed;
            bottom: 15px;
            right: 15px;
            font-size: 10px;
            color: #ffffff;
            font-weight: bold;
            opacity: 0.9;
            z-index: 9999;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            width: 50px;
        }
        
        #view-dashboard { display: none; background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); align-items: center; justify-content: center; flex-direction: column; }
        #view-dashboard.active { display: flex; }
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1000px; width: 90%; padding: 20px; }
        .dash-card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .dash-card:hover { transform: translateY(-10px); }
        .dash-icon { width: 70px; height: 70px; background: #f0f2f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--accent); }
        .dash-title { font-size: 24px; color: #2c3e50; margin-bottom: 10px; }
        .dash-desc { color: #7f8c8d; font-size: 14px; line-height: 1.6; }

        .fmt-wrapper {
            height: 100vh;
            overflow: hidden;
            padding: 10px 16px;
        }
        .fmt-container {
            width: 100%;
            height: calc(100vh - 20px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .fmt-header {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            flex: 0 0 auto;
            min-height: 46px;
            padding: 0 2px;
        }
        .fmt-header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .fmt-copyright {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .fmt-header-left {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            min-width: 0;
        }
        .theme-toggle {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
        }
        .theme-toggle:hover {
            transform: translateY(-1px);
            border-color: #b8c5d8;
            box-shadow: 0 8px 18px rgba(20, 30, 55, 0.08);
        }
        .theme-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }
        .theme-toggle .theme-icon-sun,
        body.dark-theme .theme-toggle .theme-icon-moon {
            display: none;
        }
        body.dark-theme .theme-toggle .theme-icon-sun {
            display: block;
        }
        .fmt-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--workspace-bg);
            border: 1px solid var(--workspace-border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            overflow: hidden;
        }
        .fmt-grid {
            position: relative;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            min-height: 0;
        }
        .fmt-diff-center {
            position: absolute;
            top: 61px;
            left: 50%;
            z-index: 5;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            transform: translateX(-50%);
            pointer-events: none;
        }
        .fmt-diff-center .fmt-btn,
        .fmt-diff-center .fmt-diff-count {
            pointer-events: auto;
            white-space: nowrap;
        }
        .fmt-box-group {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--surface);
        }
        .fmt-box-group + .fmt-box-group { border-right: 1px solid var(--border); }
        .fmt-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 38px;
            padding: 7px 14px;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--border);
        }
        .fmt-panel-actions {
            display: grid;
            grid-template-columns: repeat(4, 28px) minmax(150px, auto);
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }
        .fmt-icon-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, opacity 0.18s ease;
        }
        .fmt-icon-btn:hover:not(:disabled) {
            border-color: #b8c5d8;
            background: rgba(37, 99, 235, 0.08);
        }
        .fmt-icon-btn:disabled {
            cursor: not-allowed;
            opacity: 0.42;
        }
        .fmt-icon-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
        }
        .fmt-font-btn {
            font-size: 17px;
            font-weight: 900;
            line-height: 1;
        }
        .fmt-label {
            font-weight: 800;
            color: var(--text);
            font-size: 15px;
        }
        .fmt-meta {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            text-align: start;
            font-variant-numeric: tabular-nums;
        }
        .fmt-textarea {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: scroll;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding: 20px 20px 64px;
            border: 0;
            background: transparent;
            color: var(--text);
            line-height: 1.9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            transition: background-color 0.2s, box-shadow 0.2s;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .fmt-textarea:empty::before {
            content: attr(data-placeholder);
            color: var(--placeholder);
            pointer-events: none;
        }
        .fmt-textarea:focus {
            outline: none;
            background: var(--input-focus-bg);
            box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.22);
        }
        .fmt-textarea[aria-readonly="true"] { color: var(--text); }
        .fmt-highlight,
        .fmt-diff {
            padding: 1px 4px;
            border-radius: 5px;
        }
        .fmt-highlight {
            background: #fef08a;
            box-shadow: inset 0 -1px 0 rgba(133, 77, 14, 0.2);
            cursor: pointer;
        }
        .fmt-diff {
            position: relative;
            background: #dbeafe;
            color: #1e3a8a;
            font-weight: 800;
            box-shadow: inset 0 -1px 0 rgba(30, 58, 138, 0.2);
            cursor: pointer;
            transition: background-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
        }
        .fmt-diff-before {
            background: #fee2e2;
            color: #991b1b;
            box-shadow: inset 0 -1px 0 rgba(153, 27, 27, 0.22);
        }
        .fmt-diff-after {
            background: #fee2e2;
            color: #991b1b;
            box-shadow: inset 0 -1px 0 rgba(153, 27, 27, 0.22);
        }
        .fmt-diff-active {
            color: #063726;
            background: #bbf7d0;
            box-shadow:
                0 0 0 2px rgba(5, 150, 105, 0.28),
                0 8px 18px rgba(5, 150, 105, 0.16);
        }
        .fmt-edit-popover {
            position: fixed;
            display: none;
            z-index: 3000;
            width: min(360px, calc(100vw - 24px));
            padding: 10px;
            border: 1px solid rgba(15, 23, 42, 0.14);
            border-radius: 8px;
            background: var(--popover-bg);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.2);
        }
        .fmt-edit-popover.show { display: block; }
        .fmt-edit-input {
            width: 100%;
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 14px;
            direction: rtl;
        }
        .fmt-edit-input:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.14);
        }
        .fmt-edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .fmt-edit-btn {
            min-height: 34px;
            padding: 6px 12px;
            border: 0;
            border-radius: 7px;
            background: #059669;
            color: #ffffff;
            font-weight: 800;
            cursor: pointer;
        }
        .fmt-edit-btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .fmt-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0;
            background: transparent;
            flex-wrap: nowrap;
            min-width: 0;
        }
        .fmt-tool-group {
            display: flex;
            align-items: center;
            flex-direction: row;
            gap: 10px;
            min-width: 0;
        }
        .fmt-panel-search {
            padding: 8px 12px;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--border);
        }
        .fmt-box-input .fmt-panel-search { padding-left: 190px; }
        .fmt-box-output .fmt-panel-search { padding-right: 190px; }
        .fmt-input {
            width: 100%;
            min-height: 34px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            direction: rtl;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .fmt-input:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.6);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .fmt-input::placeholder { color: #98a2b3; }
        .fmt-btn-active {
            border-color: rgba(37, 99, 235, 0.4);
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary-dark);
        }
        .fmt-btn {
            min-height: 34px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
            color: var(--text);
            background: var(--input-bg);
            white-space: nowrap;
        }
        .fmt-btn-primary {
            color: white;
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
        }
        .fmt-btn:hover {
            transform: translateY(-1px);
            border-color: #b8c5d8;
            box-shadow: 0 8px 18px rgba(20, 30, 55, 0.08);
        }
        .fmt-btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .fmt-btn-danger {
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.25);
        }
        .fmt-diff-count {
            display: none;
            align-items: center;
            min-height: 34px;
            padding: 6px 12px;
            border: 1px solid rgba(30, 58, 138, 0.25);
            border-radius: 7px;
            background: #eff6ff;
            color: #1e3a8a;
            font-size: 13px;
            font-weight: 800;
        }
        .fmt-diff-count.show { display: flex; }
        .notification {
            position: fixed;
            top: 22px;
            right: 50%;
            transform: translateX(50%);
            background: var(--success);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 14px 30px rgba(5, 150, 105, 0.22);
            display: none;
            animation: slideIn 0.22s ease;
            z-index: 2000;
            font-weight: 800;
        }
        .notification.show { display: block; }
        @keyframes slideIn {
            from { opacity: 0; transform: translate(50%, -10px); }
            to { opacity: 1; transform: translate(50%, 0); }
        }
    

        .fact-layout { display: flex; height: 100%; }
        .fact-sidebar { width: 350px; background: #1a252f; color: white; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; border-left: 4px solid #3498db; }
        .fact-header { border-bottom: 2px solid #3498db; padding-bottom: 10px; font-size: 20px; text-align: center; color: #3498db; margin-top: 0; }
        .fact-group { margin-bottom: 15px; }
        .fact-label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .fact-input { width: 100%; height: 70px; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2c3e50; color: white; font-family: inherit; resize: vertical; }
        .lbl-y { color: #f1c40f; } .lbl-g { color: #2ecc71; } .lbl-r { color: #e74c3c; }
        .fact-btn-process { background: #e67e22; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .fact-btn-clear { background: #c0392b; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; }
        .fact-error { background-color: #c0392b; color: white; padding: 10px; border-radius: 5px; margin-top: 15px; font-size: 13px; display: none; text-align: center; }
        .fact-content { flex: 1; padding: 30px; display: flex; flex-direction: column; background: #fff; }
        .fact-editor { flex: 1; border: 2px solid #bdc3c7; padding: 30px; font-size: 18px; line-height: 2; color: #222; outline: none; background: #fafafa; border-radius: 8px; overflow-y: scroll; white-space: pre-wrap; min-height: 500px; max-height: calc(100vh - 100px); }
        .fact-editor:focus { border-color: #3498db; background: #fff; }
        .hl-yellow { background-color: #f1c40f; color: #000; padding: 2px 0; border-radius: 3px; font-weight: normal; }
        .hl-green { background-color: #2ecc71; color: #fff; padding: 2px 4px; border-radius: 3px; font-weight: normal; }
        .hl-red { background-color: #e74c3c; color: #fff; padding: 2px 4px; border-radius: 3px; font-weight: normal; }

        .formula-wrapper {
            background-color: var(--copy-bg);
            color: var(--copy-text);
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }
        .controls-container {
            background: var(--copy-card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border-top: 5px solid var(--copy-secondary);
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
            color: var(--copy-primary);
        }
        .input-group input[type="text"], .input-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .date-inputs {
            display: flex;
            align-items: center;
            gap: 5px;
            direction: rtl; 
        }
        .date-inputs input {
            text-align: center;
            padding: 8px 2px !important; 
        }
        .date-inputs .day, .date-inputs .month {
            width: 25% !important;
        }
        .date-inputs .year {
            width: 40% !important;
        }
        .date-inputs span {
            color: #bdc3c7;
            font-weight: bold;
        }
        .input-group input:focus {
            border-color: var(--copy-secondary);
            outline: none;
        }
        .scenarios-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }
        .scenario-card {
            background: var(--copy-card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }
        .scenario-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-color: var(--copy-secondary);
        }
        .tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            display: inline-block;
            margin-left: 5px;
        }
        .tag-m { background: #2980b9; } 
        .tag-f { background: #8e44ad; } 
        .tag-wakil { background: #e67e22; }
        .tag-src { background: #7f8c8d; }
        .card-header {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
            font-weight: bold;
            color: var(--copy-primary);
        }
        .card-content {
            flex-grow: 1;
            font-size: 14px;
            line-height: 1.8;
            background: #fafafa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #eee;
            margin-bottom: 10px;
            white-space: pre-wrap; 
        }
        .copy-btn {
            background-color: var(--copy-secondary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: 0.2s;
        }
        .copy-btn:hover { background-color: #2574a9; }
        .copy-btn.copied { background-color: var(--copy-accent); }
        .section-title {
            grid-column: 1 / -1;
            margin-top: 20px;
            padding: 10px;
            background: #dfe6e9;
            color: #2c3e50;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
        }
        .formula-h1 { text-align: center; color: var(--copy-primary); margin-bottom: 20px; }

        .profiles-bar {
            display: flex;
            gap: 10px;

    let fmtDiffPairs = [];
    let fmtEditTarget = null;
    let fmtEditObserver = null;
    let fmtSyncingScroll = false;
    const fmtHistory = new Map();
    const fmtFontSize = new Map();
    const fmtMinFontSize = 12;
    const fmtMaxFontSize = 28;
    const fmtDefaultFontSize = 16;

    function fmtDebounce(fn, delay) {
        let timerId;
        return function(...args) {
            clearTimeout(timerId);
            timerId = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    function fmtSetTheme(isDark) {
        document.body.classList.toggle('dark-theme', isDark);
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.title = isDark ? 'تبديل إلى الوضع الفاتح' : 'تبديل إلى الوضع الداكن';
        themeToggle.setAttribute('aria-label', themeToggle.title);
    }

    function fmtLoadTheme() {
        try {
            return localStorage.getItem('fmt-theme') === 'dark';
        } catch (err) {
            return false;
        }
    }

    function fmtSaveTheme(isDark) {
        try {
            localStorage.setItem('fmt-theme', isDark ? 'dark' : 'light');
        } catch (err) {}
    }

    function fmtToggleTheme() {
        const isDark = !document.body.classList.contains('dark-theme');
        fmtSetTheme(isDark);
        fmtSaveTheme(isDark);
    }

    function fmtCountLabel(value) {
        const characters = value.length.toLocaleString('ar-SA');
        const words = fmtTokenize(value).length.toLocaleString('ar-SA');
        return `${characters} حرف  ${words} كلمة`;
    }

    function fmtUpdateCounts() {
        fmtInputCount.textContent = fmtCountLabel(fmtGetText(fmtInput));
        fmtOutputCount.textContent = fmtCountLabel(fmtGetText(fmtOutput));
    }

    function fmtEscapeHtml(value) {
        return value.replace(/[&<>"']/g, ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[ch]);
    }

    function fmtEscapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function fmtSplitWords(value) {
        return value.split(/[,،]/).map(word => word.trim()).filter(Boolean);
    }

    function fmtReadDomText(el) {
        return el.innerText.replace(/\n$/, '');
    }

    function fmtSyncRawText(el) {
        el.dataset.rawText = fmtReadDomText(el);
    }

    function fmtGetText(el) {
        if (el.hasAttribute('data-raw-text')) {
            return el.dataset.rawText || '';
        }
        return fmtReadDomText(el);
    }

    function fmtSetPlainText(el, text) {
        el.dataset.rawText = text;
        el.textContent = text;
    }

    function fmtInitFontControls(el, decreaseBtn, increaseBtn) {
        fmtFontSize.set(el, {
            size: fmtDefaultFontSize,
            decreaseBtn,
            increaseBtn
        });
        fmtApplyFontSize(el);
    }

    function fmtApplyFontSize(el) {
        const state = fmtFontSize.get(el);
        if (!state) return;
        el.style.fontSize = `${state.size}px`;
        state.decreaseBtn.disabled = state.size <= fmtMinFontSize;
        state.increaseBtn.disabled = state.size >= fmtMaxFontSize;
    }

    function fmtChangeFontSize(el, delta) {
        const state = fmtFontSize.get(el);
        if (!state) return;
        state.size = Math.min(fmtMaxFontSize, Math.max(fmtMinFontSize, state.size + delta));
        fmtApplyFontSize(el);
    }

    function fmtSyncScroll(source, target) {
        if (!fmtDiffEnabled) return;
        if (fmtSyncingScroll) return;
        const sourceMax = source.scrollHeight - source.clientHeight;
        const targetMax = target.scrollHeight - target.clientHeight;
        if (sourceMax <= 0 || targetMax <= 0) return;
        fmtSyncingScroll = true;
        target.scrollTop = (source.scrollTop / sourceMax) * targetMax;
        requestAnimationFrame(() => {
            fmtSyncingScroll = false;
        });
    }

    function fmtMoveCaretToEnd(el) {
        el.focus();
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    function getCaretOffset(element) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return 0;

        const range = selection.getRangeAt(0);
        if (!element.contains(range.startContainer)) return 0;

        let offset = 0;
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
            if (node === range.startContainer) {
                return offset + range.startOffset;
            }
            offset += node.textContent.length;
        }

        return offset;
    }

    function setCaretOffset(element, offset) {
        element.focus();
        const selection = window.getSelection();
        const range = document.createRange();
        const targetOffset = Math.max(0, offset);
        let remaining = targetOffset;
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        let node;

        while ((node = walker.nextNode())) {
            const length = node.textContent.length;
            if (remaining <= length) {
                range.setStart(node, remaining);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
                return;
            }
            remaining -= length;
        }

        range.selectNodeContents(element);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    function fmtInitHistory(el, undoBtn, redoBtn) {
        fmtHistory.set(el, {
            undoStack: [fmtGetText(el)],
            redoStack: [],
            undoBtn,
            redoBtn,
            applying: false
        });
        fmtUpdateHistoryButtons(el);
    }

    function fmtUpdateHistoryButtons(el) {
        const state = fmtHistory.get(el);
        if (!state) return;
        state.undoBtn.disabled = state.undoStack.length <= 1;
        state.redoBtn.disabled = state.redoStack.length === 0;
    }

    function fmtRecordHistory(el) {
        const state = fmtHistory.get(el);
        if (!state || state.applying) return;
        const text = fmtGetText(el);
        if (state.undoStack[state.undoStack.length - 1] === text) {
            fmtUpdateHistoryButtons(el);
            return;
        }
        state.undoStack.push(text);
        if (state.undoStack.length > 100) state.undoStack.shift();
        state.redoStack = [];
        fmtUpdateHistoryButtons(el);
    }

    function fmtApplyHistory(el, text) {
        const state = fmtHistory.get(el);
        if (!state) return;
        state.applying = true;
        try {
            fmtSetPlainText(el, text);
            fmtRenderHighlights();
            fmtMoveCaretToEnd(el);
            fmtUpdateHistoryButtons(el);
        } finally {
            setTimeout(() => {
                state.applying = false;
            }, 0);
        }
    }

    function fmtUndo(el) {
        const state = fmtHistory.get(el);
        if (!state || state.undoStack.length <= 1) return;
        state.redoStack.push(state.undoStack.pop());
        fmtApplyHistory(el, state.undoStack[state.undoStack.length - 1]);
    }

    function fmtRedo(el) {
        const state = fmtHistory.get(el);
        if (!state || !state.redoStack.length) return;
        const text = state.redoStack.pop();
        state.undoStack.push(text);
        fmtApplyHistory(el, text);
    }

    function fmtPastePlainText(event) {
        event.preventDefault();
        const text = event.clipboardData.getData('text/plain');
        if (!text) return;
        if (!document.execCommand('insertText', false, text)) {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            range.deleteContents();
            const textNode = document.createTextNode(text);
            range.insertNode(textNode);
            range.setStartAfter(textNode);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
        }
        fmtSyncRawText(event.currentTarget);
        fmtUpdateCounts();
        fmtUpdateDiffCount();
        fmtRecordHistory(event.currentTarget);
        fmtRenderHighlights();
    }

    function fmtTokenize(value) {
        const tokens = [];
        value.replace(/\S+/g, (word, index) => {
            tokens.push({
                word,
                key: word.toLocaleLowerCase('ar-SA'),
                start: index,
                end: index + word.length
            });
            return word;
        });
        return tokens;
    }

    function fmtBuildDiffPairs(inputText, outputText) {
        if (!fmtDiffEnabled || (!inputText && !outputText)) return [];
        const before = fmtTokenize(inputText);
        const after = fmtTokenize(outputText);
        if (!before.length && !after.length) return [];

        const rows = before.length + 1;
        const cols = after.length + 1;
        const table = Array.from({ length: rows }, () => Array(cols).fill(0));

        for (let i = before.length - 1; i >= 0; i--) {
            for (let j = after.length - 1; j >= 0; j--) {
                table[i][j] = before[i].key === after[j].key
                    ? table[i + 1][j + 1] + 1
                    : Math.max(table[i + 1][j], table[i][j + 1]);
            }
        }

        const pairs = [];
        let i = 0;
        let j = 0;
        let beforeRun = [];
        let afterRun = [];

        function flush() {
            if (!beforeRun.length && !afterRun.length) return;
            const id = pairs.length + 1;
            pairs.push({
                id,
                before: beforeRun.length ? {
                    start: beforeRun[0].start,
                    end: beforeRun[beforeRun.length - 1].end,
                    text: inputText.slice(beforeRun[0].start, beforeRun[beforeRun.length - 1].end)
                } : null,
                after: afterRun.length ? {
                    start: afterRun[0].start,
                    end: afterRun[afterRun.length - 1].end,
                    text: outputText.slice(afterRun[0].start, afterRun[afterRun.length - 1].end)
                } : null
            });
            beforeRun = [];
            afterRun = [];
        }

        while (i < before.length && j < after.length) {
            if (before[i].key === after[j].key) {
                flush();
                i++;
                j++;
            } else if (table[i + 1][j] >= table[i][j + 1]) {
                beforeRun.push(before[i]);
                i++;
            } else {
                afterRun.push(after[j]);
                j++;
            }
        }
        while (i < before.length) beforeRun.push(before[i++]);
        while (j < after.length) afterRun.push(after[j++]);
        flush();

        return pairs;
    }

    function fmtDiffTotal() {
        if (!fmtDiffEnabled) return 0;
        return fmtDiffPairs.length;
    }

    function fmtDiffChangePercent(inputText, outputText) {
        if (!fmtDiffEnabled) return 0;
        const inputWords = fmtTokenize(inputText);
        const outputWords = fmtTokenize(outputText);
        const totalWords = Math.max(inputWords.length, outputWords.length);
        if (!totalWords) return 0;
        const changedWords = fmtDiffPairs.reduce((sum, pair) => {
            const beforeCount = pair.before ? fmtTokenize(pair.before.text).length : 0;
            const afterCount = pair.after ? fmtTokenize(pair.after.text).length : 0;
            return sum + Math.max(beforeCount, afterCount);
        }, 0);
        return Math.min(100, Math.round((changedWords / totalWords) * 100));
    }

    function fmtUpdateDiffCount() {
        const inputText = fmtGetText(fmtInput);
        const outputText = fmtGetText(fmtOutput);
        if (fmtDiffEnabled) {
            fmtDiffPairs = fmtBuildDiffPairs(inputText, outputText);
        }
        const total = fmtDiffTotal();
        const percent = fmtDiffChangePercent(inputText, outputText).toLocaleString('ar-SA');
        fmtDiffCount.textContent = `عدد التعديلات: ${total.toLocaleString('ar-SA')} • نسبة التغيير: ${percent}٪`;
        fmtDiffCount.classList.toggle('show', fmtDiffEnabled);
    }

    function fmtDiffSegmentsForBox(type) {
        if (!fmtDiffEnabled) return [];
        return fmtDiffPairs
            .map(pair => {
                const side = type === 'input' ? pair.before : pair.after;
                if (!side) return null;
                return {
                    ...side,
                    id: pair.id,
                    label: pair.id.toLocaleString('ar-SA'),
                    side: type === 'input' ? 'before' : 'after'
                };
            })
            .filter(Boolean);
    }

    function fmtTermsForBox(type) {
        const terms = [];
        const highlightSource = type === 'input' ? fmtHighlightBefore : fmtHighlightAfter;
        fmtSplitWords(highlightSource.value).forEach(word => terms.push({ word, type: 'highlight' }));
        const unique = [];
        const seen = new Set();
        terms
            .filter(item => item.word)
            .sort((a, b) => b.word.length - a.word.length)
            .forEach(item => {
                const key = item.word.toLocaleLowerCase('ar-SA');
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(item);
                }
            });
        return unique;
    }

    function fmtRenderBox(el, text, terms, diffSegments = []) {
        const shouldRestoreCaret = el === document.activeElement;
        const caretOffset = shouldRestoreCaret ? getCaretOffset(el) : 0;
        const restoreCaret = () => {
            if (shouldRestoreCaret) setCaretOffset(el, caretOffset);
        };
        el.dataset.rawText = text;

        if (!text) {
            el.innerHTML = '';
            restoreCaret();
            return;
        }
        if (!terms.length && !diffSegments.length) {
            fmtSetPlainText(el, text);
            restoreCaret();
            return;
        }
        const markers = [];
        diffSegments.forEach(segment => {
            markers.push({
                start: segment.start,
                end: segment.end,
                type: 'diff',
                id: segment.id,
                label: segment.label,
                side: segment.side
            });
        });
        if (terms.length) {
            const pattern = terms.map(item => fmtEscapeRegExp(item.word)).join('|');
            const termRegex = new RegExp(pattern, 'giu');
            let match;
            while ((match = termRegex.exec(text)) !== null) {
                const coveredByDiff = diffSegments.some(segment => match.index < segment.end && match.index + match[0].length > segment.start);
                if (!coveredByDiff) {
                    markers.push({
                        start: match.index,
                        end: match.index + match[0].length,
                        type: 'highlight'
                    });
                }
            }
        }
        markers.sort((a, b) => a.start - b.start || b.end - a.end);
        let html = '';
        let lastIndex = 0;
        markers.forEach(marker => {
            if (marker.start < lastIndex) return;
            html += fmtEscapeHtml(text.slice(lastIndex, marker.start));
            const value = fmtEscapeHtml(text.slice(marker.start, marker.end));
            if (marker.type === 'diff') {
                const sideClass = marker.side === 'before' ? 'fmt-diff-before' : 'fmt-diff-after';
                html += `<mark class="fmt-diff ${sideClass}" data-diff-id="${marker.id}" data-diff-label="${marker.label}" data-start="${marker.start}" data-end="${marker.end}" tabindex="0">${value}</mark>`;
            } else {
                html += `<mark class="fmt-highlight" data-start="${marker.start}" data-end="${marker.end}" tabindex="0">${value}</mark>`;
            }
            lastIndex = marker.end;
        });
        html += fmtEscapeHtml(text.slice(lastIndex));
        el.innerHTML = html;
        restoreCaret();
    }

    function fmtMarkActiveDiff(id) {
        document.querySelectorAll('.fmt-diff').forEach(el => {
            el.classList.toggle('fmt-diff-active', el.dataset.diffId === String(id));
        });
    }

    function fmtClearActiveDiff() {
        document.querySelectorAll('.fmt-diff-active').forEach(el => el.classList.remove('fmt-diff-active'));
    }

    function fmtScrollDiffMate(id, currentEl) {
        const mate = Array.from(document.querySelectorAll(`.fmt-diff[data-diff-id="${id}"]`)).find(el => el !== currentEl);
        if (mate) mate.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function fmtHideEditPopover() {
        if (fmtEditObserver) {
            fmtEditObserver.disconnect();
            fmtEditObserver = null;
        }
        fmtEditTarget = null;
        fmtEditPopover.classList.remove('show');
    }

    function fmtHandleEditorBlur(event) {
        if (fmtEditPopover.contains(event.relatedTarget)) return;
        fmtRenderHighlights();
    }

    function fmtPositionEditPopover(mark) {
        const rect = mark.getBoundingClientRect();
        const margin = 12;
        const width = Math.min(360, window.innerWidth - margin * 2);
        fmtEditPopover.style.width = `${width}px`;
        const top = Math.min(window.innerHeight - fmtEditPopover.offsetHeight - margin, rect.bottom + 8);
        const left = Math.min(window.innerWidth - width - margin, Math.max(margin, rect.left + (rect.width / 2) - (width / 2)));
        fmtEditPopover.style.top = `${Math.max(margin, top)}px`;
        fmtEditPopover.style.left = `${left}px`;
    }

    function fmtShowEditPopover(mark) {
        const box = mark.closest('.fmt-textarea');
        if (!box) return;
        if (fmtEditObserver) {
            fmtEditObserver.disconnect();
            fmtEditObserver = null;
        }
        fmtEditTarget = {
            box,
            start: Number(mark.dataset.start),
            end: Number(mark.dataset.end)
        };
        fmtEditInput.value = mark.innerText;
        fmtEditPopover.classList.add('show');
        fmtPositionEditPopover(mark);
        fmtEditInput.focus();
        fmtEditInput.select();
        fmtEditObserver = new IntersectionObserver(entries => {
            if (!entries[0].isIntersecting) {
                fmtHideEditPopover();
            }
        });
        fmtEditObserver.observe(mark);
    }

    function fmtReplaceEditTarget() {
        if (!fmtEditTarget) return;
        const { box, start, end } = fmtEditTarget;
        const text = fmtGetText(box);
        const replacement = fmtEditInput.value;
        fmtSetPlainText(box, text.slice(0, start) + replacement + text.slice(end));
        fmtRecordHistory(box);
        fmtHideEditPopover();
        fmtRenderHighlights();
        showNotify('تم الاستبدال');
    }

    function fmtBindDiffMarks() {
        document.querySelectorAll('.fmt-diff').forEach(mark => {
            mark.addEventListener('mouseenter', () => fmtMarkActiveDiff(mark.dataset.diffId));
            mark.addEventListener('mouseleave', fmtClearActiveDiff);
            mark.addEventListener('focus', () => fmtMarkActiveDiff(mark.dataset.diffId));
            mark.addEventListener('blur', fmtClearActiveDiff);
            mark.addEventListener('mousedown', event => event.preventDefault());
            mark.addEventListener('click', event => {
                event.preventDefault();
                fmtShowEditPopover(mark);
            });
        });
        document.querySelectorAll('.fmt-highlight').forEach(mark => {
            mark.addEventListener('mousedown', event => event.preventDefault());
            mark.addEventListener('click', event => {
                event.preventDefault();
                fmtShowEditPopover(mark);
            });
        });
    }

    function fmtRenderHighlights() {
        const inputText = fmtGetText(fmtInput);
        const outputText = fmtGetText(fmtOutput);
        fmtDiffPairs = fmtBuildDiffPairs(inputText, outputText);
        fmtRenderBox(fmtInput, inputText, fmtTermsForBox('input'), fmtDiffSegmentsForBox('input'));
        fmtRenderBox(fmtOutput, outputText, fmtTermsForBox('output'), fmtDiffSegmentsForBox('output'));
        fmtBindDiffMarks();
        fmtUpdateCounts();
        fmtUpdateDiffCount();
    }

    function fmtSetOutput(text) {
        fmtSetPlainText(fmtOutput, text);
        fmtRecordHistory(fmtOutput);
        fmtRenderHighlights();
    }

    function fmtToggleDiff() {
        if (!fmtDiffEnabled && (!fmtGetText(fmtInput).trim() || !fmtGetText(fmtOutput).trim())) return;
        fmtDiffEnabled = !fmtDiffEnabled;
        fmtDiffBtn.classList.toggle('fmt-btn-active', fmtDiffEnabled);
        if (!fmtDiffEnabled) {
            fmtClearActiveDiff();
            fmtHideEditPopover();
        }
        fmtRenderHighlights();
    }

    function fmtProcess() {
        let t = fmtGetText(fmtInput);
        if (!t) return showNotify('الرجاء لصق النص أولاً');
        t = t.replace(/\n/g, " ");
        t = t.replace(/\s+([.,:;؟!])/g, '$1').replace(/(\(|\[|\{)\s+/g, '$1').replace(/\s+(\)|\]|\})/g, '$1').replace(/([\u0621-\u064A\u0671-\u06D3])\s*,\s*([\u0621-\u064A\u0671-\u06D3])/g, '$1، $2');
        t = t.replace(/[0-9۰-۹]/g, d => ({'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩','۰':'٠','۱':'١','۲':'٢','۳':'٣','۴':'٤','۵':'٥','۶':'٦','۷':'٧','۸':'٨','۹':'٩'})[d] || d);
        t = t.replace(new RegExp('([0-9\u0660-\u0669\u06F0-\u06F9]{1,3})(?:[,\u060C]([0-9\u0660-\u0669\u06F0-\u06F9]{1,3}))+', 'g'), function(m) {
            var parts = m.split(/[,\u060C]/);
            var first = parts[0], last = parts[parts.length - 1];
            if (first.length < 3 && parts.slice(1).every(function(p) { return p.length === 3; })) return m;
            var rev = parts.slice().reverse();
            var revCorrect = rev[0].length < 3 && rev.slice(1).every(function(p) { return p.length === 3; });
            if (revCorrect) {
                var sep = m.match(/[,\u060C]/)[0];
                return rev.join(sep);
            }
            var zeroChars = '0\u0660\u06F0';
            if (parts.length >= 2 && first.length === 3 && last.length === 3) {
                if (zeroChars.indexOf(first[0]) !== -1 && zeroChars.indexOf(last[0]) === -1) {
                    var sep = m.match(/[,\u060C]/)[0];
                    return parts.reverse().join(sep);
                }
            }
            return m;
        });
        const digit = '[0-9\u0660-\u0669\u06F0-\u06F9]';
        t = t.replace(new RegExp(`(${digit}{4})([-/])(${digit}{1,2})([-/])(${digit}{1,2})`, 'g'), (m,y,s1,mo,s2,d) => {
            const yn = y.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            const dn = d.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            return (parseInt(yn)>31 && parseInt(dn)<=31) ? d+s1+mo+s2+y : m;
        });
        const dates = [], placeholders = [];
        t = t.replace(new RegExp(`${digit}+[-/]${digit}+[-/]${digit}+`, 'g'), m => {
            const p = `__D_${dates.length}__`; dates.push(m); placeholders.push(p); return p;
        });
        t = t.replace(new RegExp(`(${digit}+)([-/\\\\])(${digit}+)`, 'g'), (m,n1,s,n2) => n2+s+n1);
        placeholders.forEach((p,i) => t = t.replace(p, dates[i]));
        fmtSetOutput(t.replace(/\s+/g, " ").trim());
    }

    function fmtRemoveBreaks() {
        fmtSetOutput(fmtGetText(fmtInput).replace(/\n/g, " ").replace(/\s+/g, " ").trim());
    }

    function fmtRemoveSpaces() {
        fmtSetOutput(fmtGetText(fmtInput).replace(/\s+/g, " ").trim());
    }

    async function fmtCopy() {
        const text = fmtGetText(fmtOutput);
        if(!text) return showNotify('لا يوجد نص');
        try {
            await navigator.clipboard.writeText(text);
        } catch (err) {
            const range = document.createRange();
            range.selectNodeContents(fmtOutput);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
            selection.removeAllRanges();
        }
        showNotify('تم النسخ');
    }

    function fmtClear() {
        fmtSetPlainText(fmtInput, '');
        fmtSetPlainText(fmtOutput, '');
        fmtHighlightBefore.value = '';
        fmtHighlightAfter.value = '';
        fmtDiffPairs = [];
        fmtClearActiveDiff();
        fmtHideEditPopover();
        fmtRecordHistory(fmtInput);
        fmtRecordHistory(fmtOutput);
        fmtUpdateCounts();
        fmtUpdateDiffCount();
    }

    const fmtUpdateDiffCountDebounced = fmtDebounce(fmtUpdateDiffCount, 300);
    const fmtRecordInputHistoryDebounced = fmtDebounce(() => fmtRecordHistory(fmtInput), 500);
    const fmtRecordOutputHistoryDebounced = fmtDebounce(() => fmtRecordHistory(fmtOutput), 500);

    fmtEditPopover.addEventListener('submit', event => {
        event.preventDefault();
        fmtReplaceEditTarget();
    });

    function factGetWords(id) {

    function factProcess() {
    const err = document.getElementById('fact-error');
    err.style.display = 'none';

    const y = factGetWords('fact-yellow');
    const g = factGetWords('fact-green');
    const s = factGetWords('fact-space');

    const all = [...y, ...g, ...s];
    if (new Set(all).size !== all.length) {
        err.innerText = 'خطأ: يوجد كلمات مكررة';
        err.style.display = 'block';
        return;
    }

    const ed = document.getElementById('fact-editor');
    
    let cleanHTML = ed.innerHTML;
    cleanHTML = cleanHTML.replace(/(?:&nbsp;|\u00a0|\s){3}<span class="hl-red">/g, '<span class="hl-red">');
    cleanHTML = cleanHTML.replace(/<\/span>(?:&nbsp;|\u00a0|\s){3}/g, '</span>');
    cleanHTML = cleanHTML.replace(/<span class="hl-(?:red|yellow|green)">/g, '');
    cleanHTML = cleanHTML.replace(/<\/span>/g, '');
    ed.innerHTML = cleanHTML;

    let txt = ed.innerText;
    if (!txt.trim()) return;

    const placeholders = {};
    let phIndex = 0;

    const createPlaceholder = (html) => {
        const key = `###PH_${phIndex++}###`;
        placeholders[key] = html;
        return key;
    };

    const processList = (list, formatFn) => {
        list.sort((a, b) => b.length - a.length);
        list.forEach(w => {
            if (!w) return;
            const escW = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escW, 'g');
            txt = txt.replace(regex, (match) => createPlaceholder(formatFn(match)));
        });
    };

    processList(s, w => `&nbsp;&nbsp;&nbsp;<span class="hl-red">${w}</span>&nbsp;&nbsp;&nbsp;`);
    processList(y, w => `<span class="hl-yellow">${w}</span>`);
    processList(g, w => `<span class="hl-green">${w}</span>`);

    txt = txt.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));

    Object.keys(placeholders).forEach(key => {
        txt = txt.split(key).join(placeholders[key]);
    });

    txt = txt.replace(/\n/g, '<br>');
    ed.innerHTML = txt;
}

        card.style.boxShadow = '0 0 20px 5px #3498db';
        currentHighlightedCard = card;
    }

    function quickJump() {
        const detailSelect = document.getElementById('quick-detail');
        const index = detailSelect.value;
        if (index === '') return;
        highlightCard(index);
    }

    function resetFormula() {
        document.getElementById('name').value = '';
        document.getElementById('id_type').selectedIndex = 0;
        document.getElementById('id_num').value = '';
        document.getElementById('doc_d').value = '';
        document.getElementById('doc_m').value = '';
        document.getElementById('doc_y').value = '';
        document.getElementById('doc_num').value = '';
        document.getElementById('doc_source_manual').value = '';
        document.getElementById('lic_d').value = '';
        document.getElementById('lic_m').value = '';
        document.getElementById('lic_y').value = '';
        document.getElementById('lic_num').value = '';
        updateAll();
    }

    const PROFILES_KEY = 'savedProfiles';

    function getProfiles() {
        try { return JSON.parse(localStorage.getItem(PROFILES_KEY)) || {}; }
        catch(e) { return {}; }
    }

    function setProfiles(profiles) {
        localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles));
    }

    function getFormData() {
        return {
            name: document.getElementById('name').value,
            id_type: document.getElementById('id_type').value,
            id_num: document.getElementById('id_num').value,
            doc_d: document.getElementById('doc_d').value,
            doc_m: document.getElementById('doc_m').value,
            doc_y: document.getElementById('doc_y').value,
            doc_num: document.getElementById('doc_num').value,
            doc_source_manual: document.getElementById('doc_source_manual').value,
            lic_d: document.getElementById('lic_d').value,
            lic_m: document.getElementById('lic_m').value,
            lic_y: document.getElementById('lic_y').value,
            lic_num: document.getElementById('lic_num').value
        };
    }

    function fillForm(data) {
        document.getElementById('name').value = data.name || '';
        document.getElementById('id_type').value = data.id_type || 'الهوية الوطنية';
        document.getElementById('id_num').value = data.id_num || '';
        document.getElementById('doc_d').value = data.doc_d || '';
        document.getElementById('doc_m').value = data.doc_m || '';
        document.getElementById('doc_y').value = data.doc_y || '';
        document.getElementById('doc_num').value = data.doc_num || '';
        document.getElementById('doc_source_manual').value = data.doc_source_manual || '';
        document.getElementById('lic_d').value = data.lic_d || '';
        document.getElementById('lic_m').value = data.lic_m || '';
        document.getElementById('lic_y').value = data.lic_y || '';
        document.getElementById('lic_num').value = data.lic_num || '';
        updateAll();
    }

    let selectedProfileName = '';

    function renderDropdown(filter) {
        const dropdown = document.getElementById('profiles-dropdown');
        const profiles = getProfiles();
        const names = Object.keys(profiles);
        const query = (filter || '').trim();
        const filtered = query ? names.filter(n => n.includes(query)) : names;

        if (names.length === 0) {
            dropdown.innerHTML = '<div class="drop-empty">لا توجد بيانات محفوظة</div>';
            return;
        }
        if (filtered.length === 0) {
            dropdown.innerHTML = '<div class="drop-empty">لا توجد نتائج لـ "' + query + '"</div>';
            return;
        }

        dropdown.innerHTML = filtered.map(name => {
            const p = profiles[name];
            const idNum = p.id_num || '';
            const isSelected = name === selectedProfileName ? ' selected' : '';
            return `<div class="drop-item${isSelected}" onclick="selectProfile('${name.replace(/'/g, "\\'")}')">
                <span>${name}</span>
                <span class="item-id">${idNum}</span>
            </div>`;
        }).join('');
    }

    function openDropdown() {
        const dropdown = document.getElementById('profiles-dropdown');
        const input = document.getElementById('profile-search');
        renderDropdown(input.value);
        dropdown.classList.add('show');
    }

    function closeDropdown() {
        setTimeout(() => {
            document.getElementById('profiles-dropdown').classList.remove('show');
        }, 200);
    }

    function filterProfiles() {
        const input = document.getElementById('profile-search');
        renderDropdown(input.value);
        document.getElementById('profiles-dropdown').classList.add('show');
    }

    function selectProfile(name) {
        selectedProfileName = name;
        document.getElementById('profile-search').value = name;
        document.getElementById('profiles-dropdown').classList.remove('show');
        const profiles = getProfiles();
        if (profiles[name]) {
            fillForm(profiles[name]);
            showNotify('تم تحميل: ' + name);
        }
    }

    function refreshProfilesList() {
        selectedProfileName = '';
        document.getElementById('profile-search').value = '';
    }

    function saveProfile() {
        const name = document.getElementById('name').value.trim();
        if (!name) return showNotify('أدخل الاسم أولاً');
        const profiles = getProfiles();
        if (profiles[name] && !confirm('يوجد شخص بهذا الاسم. هل تريد تحديث بياناته؟')) return;
        profiles[name] = getFormData();
        setProfiles(profiles);
        selectedProfileName = name;
        document.getElementById('profile-search').value = name;
        showNotify('تم حفظ: ' + name);
    }

    function deleteProfile() {
        const name = selectedProfileName || document.getElementById('profile-search').value.trim();
        if (!name) return showNotify('اختر شخص أولاً');
        const profiles = getProfiles();
        if (!profiles[name]) return showNotify('هذا الشخص غير محفوظ');
        if (!confirm('هل تريد حذف "' + name + '"؟')) return;
        delete profiles[name];
        setProfiles(profiles);
        selectedProfileName = '';
        document.getElementById('profile-search').value = '';
        showNotify('تم حذف: ' + name);
    }

    function exportProfiles() {
        const profiles = getProfiles();
        if (Object.keys(profiles).length === 0) return showNotify('لا توجد بيانات محفوظة');
        const blob = new Blob([JSON.stringify(profiles, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'profiles.json';
        a.click();
        URL.revokeObjectURL(a.href);
        showNotify('تم تصدير الملف');
    }

    function importProfiles(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                const current = getProfiles();
                const merged = Object.assign({}, current, imported);
                setProfiles(merged);
                refreshProfilesList();
                showNotify('تم استيراد ' + Object.keys(imported).length + ' شخص');
            } catch(err) {
                showNotify('خطأ في قراءة الملف');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    window.onload = function() {
        renderGrid();
        refreshProfilesList();
        document.getElementById('profile-search').addEventListener('blur', closeDropdown);
    };

</script>
</body> </html>
