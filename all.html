<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنسيق النصوص</title>
    <style>
        :root {
            --nav-width: 80px;
            --bg-dark: #1a252f;
            --accent: #3498db;
            --text-light: #ecf0f1;
            
            --copy-primary: #2c3e50;
            --copy-secondary: #3498db;
            --copy-accent: #27ae60;
            --copy-bg: #f4f6f9;
            --copy-card-bg: #ffffff;
            --copy-text: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f6fa; height: 100vh; display: flex; overflow: hidden; }

        .app-nav { width: var(--nav-width); background: var(--bg-dark); height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20px; z-index: 1000; box-shadow: -2px 0 10px rgba(0,0,0,0.1); }
        .nav-btn { width: 50px; height: 50px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #95a5a6; transition: all 0.3s ease; position: relative; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }
        .nav-tooltip { position: absolute; right: 60px; background: #2c3e50; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; opacity: 0; pointer-events: none; transition: 0.2s; white-space: nowrap; }
        .nav-btn:hover .nav-tooltip { opacity: 1; right: 70px; }
        .nav-icon { width: 24px; height: 24px; }

        .app-content { flex: 1; position: relative; overflow: hidden; }
        .view-panel { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #fff; }
        .view-panel.active { display: block; }

        .app-copyright {
            position: fixed;
            bottom: 15px;
            right: 15px;
            font-size: 10px;
            color: #ffffff;
            font-weight: bold;
            opacity: 0.9;
            z-index: 9999;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            width: 50px;
        }
        
        #view-dashboard { display: none; background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); align-items: center; justify-content: center; flex-direction: column; }
        #view-dashboard.active { display: flex; }
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1000px; width: 90%; padding: 20px; }
        .dash-card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .dash-card:hover { transform: translateY(-10px); }
        .dash-icon { width: 70px; height: 70px; background: #f0f2f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--accent); }
        .dash-title { font-size: 24px; color: #2c3e50; margin-bottom: 10px; }
        .dash-desc { color: #7f8c8d; font-size: 14px; line-height: 1.6; }

        .fmt-wrapper { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100%; overflow-y: auto; padding: 40px; display: flex; justify-content: center; }
        .fmt-container { background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); padding: 40px; max-width: 95%; width: 100%; height: fit-content; min-height: 800px; margin-bottom: 40px; }
        .fmt-title { color: #667eea; text-align: center; margin-bottom: 30px; font-size: 28px; }
        .fmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .fmt-box-group { display: flex; flex-direction: column; }
        .fmt-label { font-weight: bold; color: #333; margin-bottom: 10px; font-size: 16px; }
        .fmt-textarea { width: 100%; height: 70vh; min-height: 600px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 16px; resize: vertical; transition: border-color 0.3s; }
        .fmt-textarea:focus { outline: none; border-color: #667eea; }
        .fmt-controls { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .fmt-btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s; color: white; background: #6b7280; }
        .fmt-btn-primary { background: #4f46e5; border: 1px solid #4338ca; flex-basis: 100%; max-width: 400px; }
        .fmt-btn-primary:hover { background: #4338ca; }
        .fmt-btn:hover { transform: translateY(-2px); background: #4b5563; }

        .fact-layout { display: flex; height: 100%; }
        .fact-sidebar { width: 350px; background: #1a252f; color: white; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; border-left: 4px solid #3498db; }
        .fact-header { border-bottom: 2px solid #3498db; padding-bottom: 10px; font-size: 20px; text-align: center; color: #3498db; margin-top: 0; }
        .fact-group { margin-bottom: 15px; }
        .fact-label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .fact-input { width: 100%; height: 70px; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2c3e50; color: white; font-family: inherit; resize: vertical; }
        .lbl-y { color: #f1c40f; } .lbl-g { color: #2ecc71; } .lbl-r { color: #e74c3c; }
        .fact-btn-process { background: #e67e22; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .fact-btn-clear { background: #c0392b; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; }
        .fact-error { background-color: #c0392b; color: white; padding: 10px; border-radius: 5px; margin-top: 15px; font-size: 13px; display: none; text-align: center; }
        .fact-content { flex: 1; padding: 30px; display: flex; flex-direction: column; background: #fff; }
        .fact-editor { flex: 1; border: 2px solid #bdc3c7; padding: 30px; font-size: 18px; line-height: 2; color: #222; outline: none; background: #fafafa; border-radius: 8px; overflow-y: scroll; white-space: pre-wrap; min-height: 500px; max-height: calc(100vh - 100px); }
        .fact-editor:focus { border-color: #3498db; background: #fff; }
        .hl-yellow { background-color: #f1c40f; color: #000; padding: 2px 0; border-radius: 3px; font-weight: normal; }
        .hl-green { background-color: #2ecc71; color: #fff; padding: 2px 4px; border-radius: 3px; font-weight: normal; }
        .hl-red { background-color: #e74c3c; color: #fff; padding: 2px 4px; border-radius: 3px; font-weight: normal; }

        .notification { position: fixed; top: 20px; right: 100px; background: #10b981; color: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: none; animation: slideIn 0.3s ease; z-index: 2000; }
        .notification.show { display: block; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .formula-wrapper {
            background-color: var(--copy-bg);
            color: var(--copy-text);
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }
        .controls-container {
            background: var(--copy-card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border-top: 5px solid var(--copy-secondary);
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
            color: var(--copy-primary);
        }
        .input-group input[type="text"], .input-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .date-inputs {
            display: flex;
            align-items: center;
            gap: 5px;
            direction: rtl; 
        }
        .date-inputs input {
            text-align: center;
            padding: 8px 2px !important; 
        }
        .date-inputs .day, .date-inputs .month {
            width: 25% !important;
        }
        .date-inputs .year {
            width: 40% !important;
        }
        .date-inputs span {
            color: #bdc3c7;
            font-weight: bold;
        }
        .input-group input:focus {
            border-color: var(--copy-secondary);
            outline: none;
        }
        .scenarios-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }
        .scenario-card {
            background: var(--copy-card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }
        .scenario-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-color: var(--copy-secondary);
        }
        .tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            display: inline-block;
            margin-left: 5px;
        }
        .tag-m { background: #2980b9; } 
        .tag-f { background: #8e44ad; } 
        .tag-wakil { background: #e67e22; }
        .tag-src { background: #7f8c8d; }
        .card-header {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
            font-weight: bold;
            color: var(--copy-primary);
        }
        .card-content {
            flex-grow: 1;
            font-size: 14px;
            line-height: 1.8;
            background: #fafafa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #eee;
            margin-bottom: 10px;
            white-space: pre-wrap; 
        }
        .copy-btn {
            background-color: var(--copy-secondary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: 0.2s;
        }
        .copy-btn:hover { background-color: #2574a9; }
        .copy-btn.copied { background-color: var(--copy-accent); }
        .section-title {
            grid-column: 1 / -1;
            margin-top: 20px;
            padding: 10px;
            background: #dfe6e9;
            color: #2c3e50;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
        }
        .formula-h1 { text-align: center; color: var(--copy-primary); margin-bottom: 20px; }

        .profiles-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .profiles-search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .profiles-search-wrap input {
            width: 100%;
            padding: 10px 35px 10px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            background: white;
        }
        .profiles-search-wrap input:focus { outline: none; border-color: #8e44ad; }
        .profiles-search-wrap .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            pointer-events: none;
        }
        .profiles-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .profiles-dropdown.show { display: block; }
        .profiles-dropdown .drop-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .profiles-dropdown .drop-item:last-child { border-bottom: none; }
        .profiles-dropdown .drop-item:hover { background: #f4f0ff; }
        .profiles-dropdown .drop-item.selected { background: #ede8ff; font-weight: bold; }
        .profiles-dropdown .drop-item .item-id { font-size: 11px; color: #999; }
        .profiles-dropdown .drop-empty {
            padding: 15px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }
        .profiles-bar button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-save-profile { background: #27ae60; }
        .btn-save-profile:hover { background: #219a52; }
        .btn-delete-profile { background: #e74c3c; }
        .btn-delete-profile:hover { background: #c0392b; }
        .btn-load-profile { background: #3498db; }
        .btn-load-profile:hover { background: #2980b9; }
    </style>
</head>
<body>

<nav class="app-nav">
    <div class="nav-btn active" onclick="switchTab('dashboard')" id="nav-dashboard">
        <span class="nav-tooltip">الرئيسية</span>
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
    </div>
    <div class="nav-btn" onclick="switchTab('formatting')" id="nav-formatting">
        <span class="nav-tooltip">تنسيق النص</span>
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
    </div>
    <div class="nav-btn" onclick="switchTab('facts')" id="nav-facts">
        <span class="nav-tooltip">الوقائع</span>
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
    </div>
    <div class="nav-btn" onclick="switchTab('formula')" id="nav-formula">
        <span class="nav-tooltip">صيغ الحاضرون</span>
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
    </div>
</nav>

<div class="app-copyright">محمدالمحيميد 2026</div>

<div class="app-content">
    
    <div id="view-dashboard" class="view-panel active">
        <h1 style="color:white; margin-bottom:40px; font-size:32px;"></h1>
        <div class="dash-grid">
            <div class="dash-card" onclick="switchTab('formatting')">
                <div class="dash-icon"><svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></div>
                <h3 class="dash-title">تنسيق النص</h3>
                <p class="dash-desc"></p>
            </div>
            <div class="dash-card" onclick="switchTab('facts')">
                <div class="dash-icon"><svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                <h3 class="dash-title">الوقائع</h3>
                <p class="dash-desc"></p>
            </div>
            <div class="dash-card" onclick="switchTab('formula')">
                <div class="dash-icon"><svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg></div>
                <h3 class="dash-title">صيغ الحاضرون</h3>
                <p class="dash-desc"></p>
            </div>
        </div>
    </div>

    <div id="view-formatting" class="view-panel">
        <div class="fmt-wrapper">
            <div class="fmt-container">
                <h1 class="fmt-title">تنسيق النص</h1>
                <div class="fmt-grid">
                    <div class="fmt-box-group">
                        <label class="fmt-label">النص الأصلي (من العدسة):</label>
                        <textarea id="fmt-input" class="fmt-textarea" placeholder="الصق النص هنا..."></textarea>
                    </div>
                    <div class="fmt-box-group">
                        <label class="fmt-label">النص بعد التنسيق:</label>
                        <textarea id="fmt-output" class="fmt-textarea" placeholder="" readonly></textarea>
                    </div>
                </div>
                <div class="fmt-controls">
                    <button onclick="fmtProcess()" class="fmt-btn fmt-btn-primary">معالجة شاملة</button>
                    <button onclick="fmtRemoveBreaks()" class="fmt-btn">إزالة فواصل الأسطر</button>
                    <button onclick="fmtRemoveSpaces()" class="fmt-btn">إزالة المسافات الزائدة</button>
                    <button onclick="fmtCopy()" class="fmt-btn">نسخ النتيجة</button>
                    <button onclick="fmtClear()" class="fmt-btn">مسح الكل</button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-facts" class="view-panel">
        <div class="fact-layout">
            <div class="fact-sidebar">
                <h2 class="fact-header">أدوات التحكم</h2>
                <div class="fact-group">
                    <label class="fact-label lbl-y">1. كلمات للتلوين بالأصفر (المدعي)</label>
                    <textarea id="fact-yellow" class="fact-input">المدعي، المدعية، المدعيه</textarea>
                </div>
                <div class="fact-group">
                    <label class="fact-label lbl-g">2. كلمات للتلوين بالأخضر (المدعى عليه)</label>
                    <textarea id="fact-green" class="fact-input">المدعى عليه، المدعى عليها، المدعى عليهم، المدعى علية</textarea>
                </div>
                <div class="fact-group">
                    <label class="fact-label lbl-r">3. تباعد + تلوين أحمر</label>
                    <textarea id="fact-space" class="fact-input">مذكرة</textarea>
                </div>
                <button class="fact-btn-process" onclick="factProcess()">تنفيذ التعديلات</button>
                <button class="fact-btn-clear" onclick="factClear()">مسح النص فقط</button>
                <div id="fact-error" class="fact-error"></div>
            </div>
            <div class="fact-content">
                <div style="flex: 1; display: flex; flex-direction: column;">
                    <div class="fmt-label">لصق النص هنا:</div>
                    <div id="fact-editor" class="fact-editor" contenteditable="true" placeholder="الصق النص هنا..."></div>
                </div>
            </div>
        </div>
    </div>

    <div id="view-formula" class="view-panel">
        <div class="formula-wrapper">
            <h1 class="formula-h1">صيغ الحاضرون</h1>

            <div class="controls-container" style="border-top-color: #8e44ad;">
                <div class="profiles-bar">
                    <div class="profiles-search-wrap">
                        <input type="text" id="profile-search" placeholder="ابحث عن شخص محفوظ..." autocomplete="off" onfocus="openDropdown()" oninput="filterProfiles()">
                        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <div class="profiles-dropdown" id="profiles-dropdown"></div>
                    </div>
                    <button class="btn-save-profile" onclick="saveProfile()">حفظ</button>
                    <button class="btn-delete-profile" onclick="deleteProfile()">حذف</button>
                    <button class="btn-save-profile" style="background:#8e44ad;" onclick="exportProfiles()">تصدير ملف</button>
                    <button class="btn-load-profile" onclick="document.getElementById('import-file').click()">استيراد ملف</button>
                    <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importProfiles(event)">
                </div>
            </div>

            <div class="controls-container">

    function showNotify(msg) {
        const n = document.getElementById('notify');
        n.textContent = msg;
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 2000);
    }

    function fmtProcess() {
        let t = document.getElementById('fmt-input').value;
        if (!t) return showNotify('الرجاء لصق النص أولاً');
        t = t.replace(/\n/g, " ");
        t = t.replace(/\s+([.,:;؟!])/g, '$1').replace(/(\(|\[|\{)\s+/g, '$1').replace(/\s+(\)|\]|\})/g, '$1').replace(/([\u0621-\u064A\u0671-\u06D3])\s*,\s*([\u0621-\u064A\u0671-\u06D3])/g, '$1، $2');
        t = t.replace(/[0-9۰-۹]/g, d => ({'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩','۰':'٠','۱':'١','۲':'٢','۳':'٣','۴':'٤','۵':'٥','۶':'٦','۷':'٧','۸':'٨','۹':'٩'})[d] || d);
        t = t.replace(new RegExp('([0-9\u0660-\u0669\u06F0-\u06F9]{1,3})(?:[,\u060C]([0-9\u0660-\u0669\u06F0-\u06F9]{1,3}))+', 'g'), function(m) {
            var parts = m.split(/[,\u060C]/);
            var first = parts[0], last = parts[parts.length - 1];
            if (first.length < 3 && parts.slice(1).every(function(p) { return p.length === 3; })) return m;
            var rev = parts.slice().reverse();
            if (rev[0].length < 3 && rev.slice(1).every(function(p) { return p.length === 3; })) {
                return rev.join(m.match(/[,\u060C]/)[0]);
            }
            var zeroChars = '0\u0660\u06F0';
            if (parts.length >= 2 && first.length === 3 && last.length === 3) {
                if (zeroChars.indexOf(first[0]) !== -1 && zeroChars.indexOf(last[0]) === -1) {
                    return parts.reverse().join(m.match(/[,\u060C]/)[0]);
                }
            }
            return m;
        });
        const digit = '[0-9\u0660-\u0669\u06F0-\u06F9]';
        t = t.replace(new RegExp(`(${digit}{4})([-/])(${digit}{1,2})([-/])(${digit}{1,2})`, 'g'), (m,y,s1,mo,s2,d) => {
            const yn = y.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            const dn = d.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            return (parseInt(yn)>31 && parseInt(dn)<=31) ? d+s1+mo+s2+y : m;
        });
        const dates = [], placeholders = [];
        t = t.replace(new RegExp(`${digit}+[-/]${digit}+[-/]${digit}+`, 'g'), m => {
            const p = `__D_${dates.length}__`; dates.push(m); placeholders.push(p); return p;
        });
        t = t.replace(new RegExp(`(${digit}+)([-/\\\\])(${digit}+)`, 'g'), (m,n1,s,n2) => n2+s+n1);
        placeholders.forEach((p,i) => t = t.replace(p, dates[i]));
        document.getElementById('fmt-output').value = t.replace(/\s+/g, " ").trim();
    }
    function fmtRemoveBreaks() {
        document.getElementById('fmt-output').value = document.getElementById('fmt-input').value.replace(/\n/g, " ").replace(/\s+/g, " ").trim();

        document.getElementById('fmt-output').value = document.getElementById('fmt-input').value.replace(/\s+/g, " ").trim();
    }

        el.select(); document.execCommand('copy'); showNotify('تم النسخ');
    }

    document.getElementById('fact-editor').addEventListener('paste', function(e) {

    function factGetWords(id) {
        return document.getElementById(id).value.split(/,|،/).map(w=>w.trim()).filter(w=>w);

    function factProcess() {
    const err = document.getElementById('fact-error');
    err.style.display = 'none';

    const y = factGetWords('fact-yellow');
    const g = factGetWords('fact-green');
    const s = factGetWords('fact-space');

    const all = [...y, ...g, ...s];
    if (new Set(all).size !== all.length) {
        err.innerText = 'خطأ: يوجد كلمات مكررة';
        err.style.display = 'block';
        return;
    }

    const ed = document.getElementById('fact-editor');
    
    let cleanHTML = ed.innerHTML;
    cleanHTML = cleanHTML.replace(/(?:&nbsp;|\u00a0|\s){3}<span class="hl-red">/g, '<span class="hl-red">');
    cleanHTML = cleanHTML.replace(/<\/span>(?:&nbsp;|\u00a0|\s){3}/g, '</span>');
    cleanHTML = cleanHTML.replace(/<span class="hl-(?:red|yellow|green)">/g, '');
    cleanHTML = cleanHTML.replace(/<\/span>/g, '');
    ed.innerHTML = cleanHTML;

    let txt = ed.innerText;
    if (!txt.trim()) return;

    const placeholders = {};
    let phIndex = 0;

    const createPlaceholder = (html) => {
        const key = `###PH_${phIndex++}###`;
        placeholders[key] = html;
        return key;
    };

    const processList = (list, formatFn) => {
        list.sort((a, b) => b.length - a.length);
        list.forEach(w => {
            if (!w) return;
            const escW = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escW, 'g');
            txt = txt.replace(regex, (match) => createPlaceholder(formatFn(match)));
        });
    };

    processList(s, w => `&nbsp;&nbsp;&nbsp;<span class="hl-red">${w}</span>&nbsp;&nbsp;&nbsp;`);
    processList(y, w => `<span class="hl-yellow">${w}</span>`);
    processList(g, w => `<span class="hl-green">${w}</span>`);

    txt = txt.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));

    Object.keys(placeholders).forEach(key => {
        txt = txt.split(key).join(placeholders[key]);
    });

    txt = txt.replace(/\n/g, '<br>');
    ed.innerHTML = txt;
}

        scenarios.forEach((s, index) => {

                filerRole: s.fRole,
                filerGender: s.fGen,
                wakalaSource: s.src,

            });
            document.getElementById(`text_${index}`).innerText = text;
        });
    }

    function copyText(elementId, btnElement) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const originalHTML = btnElement.innerHTML;
            btnElement.innerHTML = `
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                تم النسخ
            `;
            btnElement.classList.add('copied');
            
            setTimeout(() => {
                btnElement.innerHTML = originalHTML;
                btnElement.classList.remove('copied');
            }, 1500);
        });
    }

    let currentHighlightedCard = null;

    function highlightCard(index) {
        if (currentHighlightedCard) {
            currentHighlightedCard.style.boxShadow = '';

        const card = document.querySelector(`#text_${index}`).closest('.scenario-card');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.style.boxShadow = '0 0 20px 5px #3498db';

    function resetFormula() {
        document.getElementById('name').value = '';
        document.getElementById('id_type').selectedIndex = 0;
        document.getElementById('id_num').value = '';
        document.getElementById('doc_d').value = '';
        document.getElementById('doc_m').value = '';
        document.getElementById('doc_y').value = '';
        document.getElementById('doc_num').value = '';
        document.getElementById('doc_source_manual').value = '';
        document.getElementById('lic_d').value = '';
        document.getElementById('lic_m').value = '';
        document.getElementById('lic_y').value = '';
        document.getElementById('lic_num').value = '';
        updateAll();
    }

    const PROFILES_KEY = 'savedProfiles';

    function getProfiles() {
        try { return JSON.parse(localStorage.getItem(PROFILES_KEY)) || {}; }
        catch(e) { return {}; }
    }

    function setProfiles(profiles) {
        localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles));
    }

    function getFormData() {
        return {
            name: document.getElementById('name').value,
            id_type: document.getElementById('id_type').value,
            id_num: document.getElementById('id_num').value,
            doc_d: document.getElementById('doc_d').value,
            doc_m: document.getElementById('doc_m').value,
            doc_y: document.getElementById('doc_y').value,
            doc_num: document.getElementById('doc_num').value,
            doc_source_manual: document.getElementById('doc_source_manual').value,
            lic_d: document.getElementById('lic_d').value,
            lic_m: document.getElementById('lic_m').value,
            lic_y: document.getElementById('lic_y').value,
            lic_num: document.getElementById('lic_num').value
        };
    }

    function fillForm(data) {
        document.getElementById('name').value = data.name || '';
        document.getElementById('id_type').value = data.id_type || 'الهوية الوطنية';
        document.getElementById('id_num').value = data.id_num || '';
        document.getElementById('doc_d').value = data.doc_d || '';
        document.getElementById('doc_m').value = data.doc_m || '';
        document.getElementById('doc_y').value = data.doc_y || '';
        document.getElementById('doc_num').value = data.doc_num || '';
        document.getElementById('doc_source_manual').value = data.doc_source_manual || '';
        document.getElementById('lic_d').value = data.lic_d || '';
        document.getElementById('lic_m').value = data.lic_m || '';
        document.getElementById('lic_y').value = data.lic_y || '';
        document.getElementById('lic_num').value = data.lic_num || '';
        updateAll();
    }

    let selectedProfileName = '';

    function renderDropdown(filter) {
        const dropdown = document.getElementById('profiles-dropdown');
        const profiles = getProfiles();
        const names = Object.keys(profiles);
        const query = (filter || '').trim();
        const filtered = query ? names.filter(n => n.includes(query)) : names;

        if (names.length === 0) {
            dropdown.innerHTML = '<div class="drop-empty">لا توجد بيانات محفوظة</div>';
            return;
        }
        if (filtered.length === 0) {
            dropdown.innerHTML = '<div class="drop-empty">لا توجد نتائج لـ "' + query + '"</div>';
            return;
        }

        dropdown.innerHTML = filtered.map(name => {
            const p = profiles[name];
            const idNum = p.id_num || '';
            const isSelected = name === selectedProfileName ? ' selected' : '';
            return `<div class="drop-item${isSelected}" onclick="selectProfile('${name.replace(/'/g, "\\'")}')">
                <span>${name}</span>
                <span class="item-id">${idNum}</span>
            </div>`;
        }).join('');
    }

    function openDropdown() {
        const dropdown = document.getElementById('profiles-dropdown');
        const input = document.getElementById('profile-search');
        renderDropdown(input.value);
        dropdown.classList.add('show');
    }

    function closeDropdown() {
        setTimeout(() => {
            document.getElementById('profiles-dropdown').classList.remove('show');
        }, 200);
    }

    function filterProfiles() {
        const input = document.getElementById('profile-search');
        renderDropdown(input.value);
        document.getElementById('profiles-dropdown').classList.add('show');
    }

    function selectProfile(name) {
        selectedProfileName = name;
        document.getElementById('profile-search').value = name;
        document.getElementById('profiles-dropdown').classList.remove('show');
        const profiles = getProfiles();
        if (profiles[name]) {
            fillForm(profiles[name]);
            showNotify('تم تحميل: ' + name);
        }
    }

    function refreshProfilesList() {
        selectedProfileName = '';
        document.getElementById('profile-search').value = '';
    }

    function saveProfile() {
        const name = document.getElementById('name').value.trim();
        if (!name) return showNotify('أدخل الاسم أولاً');
        const profiles = getProfiles();
        if (profiles[name] && !confirm('يوجد شخص بهذا الاسم. هل تريد تحديث بياناته؟')) return;
        profiles[name] = getFormData();
        setProfiles(profiles);
        selectedProfileName = name;
        document.getElementById('profile-search').value = name;
        showNotify('تم حفظ: ' + name);
    }

    function deleteProfile() {
        const name = selectedProfileName || document.getElementById('profile-search').value.trim();
        if (!name) return showNotify('اختر شخص أولاً');
        const profiles = getProfiles();
        if (!profiles[name]) return showNotify('هذا الشخص غير محفوظ');
        if (!confirm('هل تريد حذف "' + name + '"؟')) return;
        delete profiles[name];
        setProfiles(profiles);
        selectedProfileName = '';
        document.getElementById('profile-search').value = '';
        showNotify('تم حذف: ' + name);
    }

    function exportProfiles() {
        const profiles = getProfiles();
        if (Object.keys(profiles).length === 0) return showNotify('لا توجد بيانات محفوظة');
        const blob = new Blob([JSON.stringify(profiles, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'profiles.json';
        a.click();
        URL.revokeObjectURL(a.href);
        showNotify('تم تصدير الملف');
    }

    function importProfiles(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                const current = getProfiles();
                const merged = Object.assign({}, current, imported);
                setProfiles(merged);
                refreshProfilesList();
                showNotify('تم استيراد ' + Object.keys(imported).length + ' شخص');
            } catch(err) {
                showNotify('خطأ في قراءة الملف');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    window.onload = function() {
        renderGrid();
        refreshProfilesList();
        document.getElementById('profile-search').addEventListener('blur', closeDropdown);
    };
