<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معالجة النصوص</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

        :root {
            color-scheme: light;
            --bg: #eef3f7;
            --surface: #ffffff;
            --surface-muted: #f7f9fc;
            --surface-raised: rgba(255, 255, 255, 0.92);
            --border: #d8e1ec;
            --border-strong: #c7d2df;
            --border-subtle: rgba(216, 225, 236, 0.72);
            --text: #162033;
            --muted: #637083;
            --primary: #1f6feb;
            --primary-dark: #1959c6;
            --primary-soft: #e8f1ff;
            --accent: #0d9488;
            --accent-dark: #0f766e;
            --accent-soft: #e2faf5;
            --success: #0d9488;
            --danger: #dc2626;
            --danger-soft: #fff1f2;
            --warning: #b7791f;
            --warning-soft: #fff7d6;
            --shadow: 0 22px 60px rgba(32, 45, 69, 0.14);
            --shadow-soft: 0 10px 28px rgba(32, 45, 69, 0.08);
            --shadow-hover: 0 12px 28px rgba(31, 111, 235, 0.14);
            --body-start: #f8fbff;
            --body-end: #eaf2f0;
            --workspace-bg: rgba(255, 255, 255, 0.88);
            --workspace-border: rgba(198, 211, 226, 0.9);
            --input-bg: #ffffff;
            --input-focus-bg: #fbfdff;
            --placeholder: #98a2b3;
            --popover-bg: rgba(255, 255, 255, 0.96);
            --selection-bg: rgba(31, 111, 235, 0.18);
            --focus-ring: rgba(31, 111, 235, 0.18);
            --toolbar-bg: rgba(255, 255, 255, 0.68);
        }

        body.dark-theme {
            color-scheme: dark;
            --bg: #101820;
            --surface: #151f2a;
            --surface-muted: #1b2734;
            --surface-raised: rgba(21, 31, 42, 0.94);
            --border: #304154;
            --border-strong: #40556a;
            --border-subtle: rgba(64, 85, 106, 0.58);
            --text: #e8edf3;
            --muted: #a0aaba;
            --primary: #6aa4ff;
            --primary-dark: #8bb8ff;
            --primary-soft: rgba(106, 164, 255, 0.14);
            --accent: #3dd6c2;
            --accent-dark: #73eadc;
            --accent-soft: rgba(61, 214, 194, 0.14);
            --success: #3dd6c2;
            --danger: #fb7185;
            --danger-soft: rgba(251, 113, 133, 0.12);
            --warning: #f7c66a;
            --warning-soft: rgba(247, 198, 106, 0.16);
            --shadow: 0 24px 64px rgba(0, 0, 0, 0.34);
            --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.24);
            --shadow-hover: 0 14px 32px rgba(0, 0, 0, 0.28);
            --body-start: #111a22;
            --body-end: #0d141b;
            --workspace-bg: rgba(18, 27, 36, 0.9);
            --workspace-border: rgba(64, 85, 106, 0.86);
            --input-bg: #111a22;
            --input-focus-bg: #14202b;
            --placeholder: #738094;
            --popover-bg: rgba(21, 31, 42, 0.97);
            --selection-bg: rgba(106, 164, 255, 0.24);
            --focus-ring: rgba(106, 164, 255, 0.22);
            --toolbar-bg: rgba(21, 31, 42, 0.68);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-width: 1280px;
            height: 100vh;
            overflow: hidden;
            direction: rtl;
            text-align: right;
            font-family: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 0;
            background:
                linear-gradient(135deg, var(--body-start) 0%, var(--bg) 48%, var(--body-end) 100%);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(99, 112, 131, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 112, 131, 0.045) 1px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.42), transparent 70%);
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.42), transparent 70%);
        }

        body.dark-theme::before {
            background-image:
                linear-gradient(rgba(160, 170, 186, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(160, 170, 186, 0.045) 1px, transparent 1px);
        }

        ::selection {
            background: var(--selection-bg);
            color: var(--text);
        }

        button,
        input,
        [contenteditable] {
            font: inherit;
        }

        button {
            text-align: center;
            user-select: none;
        }

        .app-content {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
        }

        .view-panel {
            width: 100%;
            min-height: 100vh;
            display: block;
        }

        .fmt-wrapper {
            height: 100vh;
            overflow: hidden;
            padding: 10px 16px;
        }

        .fmt-container {
            width: 100%;
            height: calc(100vh - 20px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fmt-header {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            flex: 0 0 auto;
            min-height: 46px;
            padding: 0 2px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--surface-raised);
            box-shadow: var(--shadow-soft);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }

        .fmt-header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-copyright {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .fmt-header-left {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            min-width: 0;
        }

        .fmt-header-left #fmt-compare-mode {
            border-color: rgba(13, 148, 136, 0.28);
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .fmt-header-left #fmt-compare-mode:hover {
            border-color: var(--accent);
            color: var(--accent-dark);
            box-shadow: 0 10px 22px rgba(13, 148, 136, 0.16);
        }

        .fmt-header-left #fmt-compare-mode.fmt-btn-active {
            border-color: var(--accent);
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: #ffffff;
        }

        .fmt-header-left #fmt-compare-mode.fmt-btn-active:hover {
            color: #ffffff;
        }

        .fmt-header-left #fmt-mini-mode {
            border-color: rgba(31, 111, 235, 0.26);
            background: var(--primary-soft);
            color: var(--primary-dark);
        }

        .fmt-header-left #fmt-mini-mode:hover {
            border-color: var(--primary);
            color: var(--primary-dark);
            box-shadow: 0 10px 22px rgba(31, 111, 235, 0.16);
        }

        .fmt-header-left #fmt-mini-mode.fmt-btn-active {
            border-color: var(--primary);
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff;
        }

        .fmt-header-left #fmt-mini-mode.fmt-btn-active:hover {
            color: #ffffff;
        }

        .fmt-header-left #fmt-focus-mode {
            border-color: rgba(13, 148, 136, 0.26);
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .fmt-header-left #fmt-focus-mode:hover {
            border-color: var(--accent);
            color: var(--accent-dark);
            box-shadow: 0 10px 22px rgba(13, 148, 136, 0.16);
        }

        .fmt-header-left #fmt-focus-mode.fmt-btn-active {
            border-color: var(--accent);
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: #ffffff;
        }

        .fmt-header-left #fmt-focus-mode.fmt-btn-active:hover {
            color: #ffffff;
        }

        #fmt-review-mode {
            border-color: rgba(183, 121, 31, 0.3);
            background: var(--warning-soft);
            color: var(--warning);
        }

        #fmt-review-mode:hover:not(:disabled) {
            border-color: var(--warning);
            color: var(--warning);
            box-shadow: 0 10px 22px rgba(183, 121, 31, 0.16);
        }

        #fmt-review-mode.fmt-btn-active {
            border-color: var(--warning);
            background: linear-gradient(180deg, #c9852f 0%, #9f5f16 100%);
            color: #ffffff;
        }

        #fmt-review-mode.fmt-btn-active:hover {
            color: #ffffff;
        }

        body.fmt-compare-active #fmt-review-mode {
            display: none;
        }

        .theme-toggle {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--input-bg);
            color: var(--muted);
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background-color 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            color: var(--primary-dark);
            border-color: var(--border-strong);
            box-shadow: var(--shadow-hover);
        }

        .theme-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .theme-toggle .theme-icon-sun,
        body.dark-theme .theme-toggle .theme-icon-moon {
            display: none;
        }

        body.dark-theme .theme-toggle .theme-icon-sun {
            display: block;
        }

        .fmt-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--workspace-bg);
            border: 1px solid var(--workspace-border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            overflow: hidden;
        }

        .fmt-grid {
            position: relative;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            min-height: 0;
        }

        .fmt-diff-center {
            position: absolute;
            top: 61px;
            left: 50%;
            z-index: 5;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            transform: translateX(-50%);
            pointer-events: none;
            padding: 4px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--toolbar-bg);
            box-shadow: var(--shadow-soft);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
        }

        .fmt-diff-center .fmt-btn,
        .fmt-diff-center .fmt-diff-count {
            pointer-events: auto;
            white-space: nowrap;
        }

        .fmt-box-group {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--surface);
        }

        .fmt-box-group + .fmt-box-group {
            border-right: 1px solid var(--border);
        }

        .fmt-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 38px;
            padding: 7px 14px;
            background:
                linear-gradient(180deg, var(--surface-muted) 0%, var(--surface) 100%);
            border-bottom: 1px solid var(--border);
        }

        .fmt-panel-actions {
            display: grid;
            grid-template-columns: repeat(4, 28px) minmax(150px, auto);
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }

        .fmt-icon-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--input-bg);
            color: var(--muted);
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.48);
            transition:
                transform 0.18s ease,
                background-color 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease,
                opacity 0.18s ease,
                box-shadow 0.18s ease;
        }

        .fmt-icon-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            color: var(--primary-dark);
            border-color: var(--border-strong);
            background: var(--primary-soft);
            box-shadow: var(--shadow-hover);
        }

        .fmt-icon-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .fmt-icon-btn:disabled {
            cursor: not-allowed;
            opacity: 0.42;
            box-shadow: none;
        }

        .fmt-icon-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
        }

        .fmt-font-btn {
            font-size: 17px;
            font-weight: 900;
            line-height: 1;
        }

        .fmt-label {
            font-weight: 800;
            color: var(--text);
            font-size: 15px;
            letter-spacing: 0;
        }

        .fmt-meta {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            text-align: start;
            font-variant-numeric: tabular-nums;
        }

        .fmt-textarea {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: scroll;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            padding: 20px 20px 64px;
            border: 0;
            background: transparent;
            color: var(--text);
            line-height: 1.9;
            font-family: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
            font-size: 16px;
            font-weight: 500;
            direction: rtl;
            text-align: right;
            transition: background-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
            white-space: pre-wrap;
            word-break: break-word;
            caret-color: var(--primary);
        }

        .fmt-textarea::-webkit-scrollbar {
            width: 12px;
        }

        .fmt-textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        .fmt-textarea::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 999px;
            background: var(--border-strong);
            background-clip: content-box;
        }

        .fmt-textarea::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
            background-clip: content-box;
        }

        .fmt-textarea:empty::before {
            content: attr(data-placeholder);
            color: var(--placeholder);
            pointer-events: none;
            font-weight: 600;
        }

        .fmt-textarea:focus {
            outline: none;
            background: var(--input-focus-bg);
            box-shadow: inset 0 0 0 2px var(--focus-ring);
        }

        .fmt-textarea[aria-readonly="true"] {
            color: var(--text);
        }

        .fmt-highlight,
        .fmt-diff {
            padding: 1px 4px;
            border-radius: 5px;
        }

        .fmt-highlight {
            background: var(--warning-soft);
            color: #6f4a0d;
            box-shadow: inset 0 -1px 0 rgba(183, 121, 31, 0.22);
            cursor: pointer;
            transition: background-color 0.18s ease, box-shadow 0.18s ease;
        }

        .fmt-highlight:hover {
            box-shadow:
                inset 0 -1px 0 rgba(183, 121, 31, 0.24),
                0 0 0 2px rgba(183, 121, 31, 0.12);
        }

        body.dark-theme .fmt-highlight {
            color: #ffe2a4;
        }

        .fmt-diff {
            position: relative;
            background: var(--primary-soft);
            color: #184ea3;
            font-weight: 800;
            box-shadow: inset 0 -1px 0 rgba(31, 111, 235, 0.2);
            cursor: pointer;
            transition: background-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
        }

        body.dark-theme .fmt-diff {
            color: #cfe0ff;
        }

        .fmt-diff-before {
            background: var(--danger-soft);
            color: #991b1b;
            box-shadow: inset 0 -1px 0 rgba(220, 38, 38, 0.22);
        }

        body.dark-theme .fmt-diff-before {
            color: #fecdd3;
        }

        .fmt-diff-after {
            background: var(--danger-soft);
            color: #991b1b;
            box-shadow: inset 0 -1px 0 rgba(220, 38, 38, 0.22);
        }

        body.dark-theme .fmt-diff-after {
            color: #fecdd3;
        }

        body.fmt-compare-active .fmt-diff-before {
            background: var(--danger-soft);
            color: #9f1239;
        }

        body.fmt-compare-active .fmt-diff-after {
            background: var(--accent-soft);
            color: #065f56;
            box-shadow: inset 0 -1px 0 rgba(13, 148, 136, 0.22);
        }

        body.dark-theme.fmt-compare-active .fmt-diff-before {
            color: #fecdd3;
        }

        body.dark-theme.fmt-compare-active .fmt-diff-after {
            color: #b8fff4;
        }

        .fmt-diff-active {
            color: #053b35;
            background: var(--accent-soft);
            box-shadow:
                0 0 0 2px rgba(13, 148, 136, 0.26),
                0 8px 18px rgba(13, 148, 136, 0.14);
        }

        body.dark-theme .fmt-diff-active {
            color: #d7fff9;
        }

        .fmt-review-mark {
            padding: 1px 5px;
            border-radius: 5px;
            background: var(--warning-soft);
            color: #7c4a03;
            font-weight: 800;
            box-shadow: inset 0 -1px 0 rgba(183, 121, 31, 0.24);
            cursor: pointer;
        }

        body.dark-theme .fmt-review-mark {
            color: #ffe4a8;
        }

        .fmt-review-mark-active {
            box-shadow:
                inset 0 -1px 0 rgba(183, 121, 31, 0.24),
                0 0 0 2px rgba(183, 121, 31, 0.24),
                0 8px 18px rgba(183, 121, 31, 0.14);
        }

        .fmt-review-anchor {
            position: relative;
            display: inline-flex;
            width: 0;
            min-height: 1.4em;
            vertical-align: middle;
            cursor: pointer;
        }

        .fmt-review-anchor::after {
            content: "";
            position: absolute;
            top: 0.28em;
            left: -5px;
            width: 9px;
            height: 9px;
            border: 2px solid var(--surface);
            border-radius: 50%;
            background: var(--warning);
            box-shadow: 0 0 0 2px rgba(183, 121, 31, 0.22);
        }

        .fmt-review-panel {
            position: absolute;
            top: 106px;
            left: 14px;
            bottom: 14px;
            z-index: 8;
            width: 330px;
            display: none;
            flex-direction: column;
            min-height: 0;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--popover-bg);
            box-shadow: 0 24px 52px rgba(20, 30, 45, 0.18);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            overflow: hidden;
        }

        body.fmt-review-active .fmt-review-panel {
            display: flex;
        }

        body.fmt-review-active .fmt-box-output .fmt-textarea {
            padding-left: 366px;
        }

        .fmt-review-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 48px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background:
                linear-gradient(180deg, var(--surface-muted) 0%, var(--surface) 100%);
        }

        .fmt-review-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .fmt-review-title strong {
            font-size: 14px;
            font-weight: 900;
            color: var(--text);
        }

        .fmt-review-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .fmt-review-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--surface);
        }

        .fmt-review-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            flex: 0 0 auto;
            min-height: 0;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .fmt-review-card-active {
            border-color: var(--warning);
            box-shadow:
                0 0 0 2px rgba(183, 121, 31, 0.16),
                var(--shadow-soft);
        }

        .fmt-review-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--surface-muted);
        }

        .fmt-review-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 24px;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--warning-soft);
            color: var(--warning);
            font-size: 11px;
            font-weight: 900;
            white-space: nowrap;
        }

        .fmt-review-card-body {
            display: grid;
            gap: 8px;
            padding: 10px;
        }

        .fmt-review-reason {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            line-height: 1.65;
        }

        .fmt-review-change {
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr);
            gap: 8px;
            align-items: start;
            font-size: 12px;
            font-weight: 800;
        }

        .fmt-review-change span {
            color: var(--muted);
        }

        .fmt-review-change strong {
            min-width: 0;
            color: var(--text);
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .fmt-review-card-actions {
            display: grid;

        .fmt-review-accept {

        .fmt-review-reject {

        .fmt-review-reject:hover:not(:disabled) {

            text-align: center;

        .fmt-edit-popover {

            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--popover-bg);
            box-shadow: 0 24px 48px rgba(20, 30, 45, 0.22);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }

        .fmt-edit-popover.show {
            display: block;
        }

        .fmt-edit-input {
            width: 100%;
            height: 38px;
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            direction: rtl;
            text-align: right;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;

        .fmt-edit-input:focus {

            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.14);
        }

        .fmt-edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .fmt-edit-btn {
            min-height: 34px;
            padding: 6px 12px;
            border: 0;
            border-radius: 7px;
            background: var(--accent);
            color: #ffffff;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }

        .fmt-edit-btn:hover {
            transform: translateY(-1px);
            background: var(--accent-dark);
            box-shadow: 0 10px 22px rgba(13, 148, 136, 0.18);
        }

        .fmt-edit-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
        }

        .fmt-edit-btn-secondary {
            background: #e7ecf2;
            color: #374151;
        }

        body.dark-theme .fmt-edit-btn-secondary {
            background: #283746;
            color: var(--text);
        }

        .fmt-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0;
            background: transparent;
            flex-wrap: nowrap;
            min-width: 0;
        }

        .fmt-tool-group {
            display: flex;
            align-items: center;
            flex-direction: row;
            gap: 10px;
            min-width: 0;
        }

        .fmt-panel-search {
            padding: 8px 12px;
            background:
                linear-gradient(180deg, var(--surface-muted) 0%, var(--surface) 100%);
            border-bottom: 1px solid var(--border);
        }

        .fmt-box-input .fmt-panel-search {
            padding-left: 190px;
        }

        .fmt-box-output .fmt-panel-search {
            padding-right: 190px;
        }

        .fmt-input {
            width: 100%;
            height: 34px;
            min-height: 34px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            direction: rtl;
            text-align: right;
            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                background-color 0.18s ease;
        }

        .fmt-input:focus {
            outline: none;
            border-color: rgba(31, 111, 235, 0.65);
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .fmt-input::placeholder {
            color: var(--placeholder);
            font-weight: 600;
        }

        .fmt-btn-active {
            border-color: rgba(31, 111, 235, 0.45);
            background: var(--primary-soft);
            color: var(--primary-dark);
        }

        .fmt-btn {
            min-height: 34px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background-color 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
            color: var(--text);
            background: var(--input-bg);
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.52);
        }

        .fmt-btn-primary {
            color: white;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: var(--primary);
            box-shadow:
                0 10px 22px rgba(31, 111, 235, 0.23),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .fmt-btn:hover {
            transform: translateY(-1px);
            border-color: var(--border-strong);
            color: var(--primary-dark);
            box-shadow: var(--shadow-hover);
        }

        .fmt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.46;
            transform: none;
            box-shadow: none;
        }

        .fmt-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .fmt-btn-primary:hover {
            color: #ffffff;
            background: linear-gradient(180deg, var(--primary-dark) 0%, #134aa8 100%);
            border-color: var(--primary-dark);
        }

        body.dark-theme .fmt-btn-primary:hover {
            background: linear-gradient(180deg, var(--primary-dark) 0%, #4f8fea 100%);
        }

        .fmt-btn-danger {
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.28);
            background: var(--danger-soft);
        }

        .fmt-btn-danger:hover {
            color: #ffffff;
            border-color: var(--danger);
            background: var(--danger);
            box-shadow: 0 10px 22px rgba(220, 38, 38, 0.18);

        body.fmt-compare-active .fmt-box-input .fmt-panel-head,
        body.fmt-compare-active .fmt-box-output .fmt-panel-head {
            background:
                linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 100%);
        }

        body.fmt-compare-active .fmt-box-input .fmt-label,
        body.fmt-compare-active .fmt-box-output .fmt-label {
            color: var(--accent-dark);
        }

        .fmt-diff-count {
            display: none;
            align-items: center;
            min-height: 34px;
            padding: 6px 12px;
            border: 1px solid rgba(31, 111, 235, 0.25);
            border-radius: 7px;
            background: var(--primary-soft);
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: 800;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);

        .fmt-diff-count.show {
            display: flex;
        }

        .notification {

            top: 22px;
            right: 50%;

            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 18px 34px rgba(13, 148, 136, 0.24);

            animation: slideIn 0.22s ease;
            z-index: 2000;
            font-weight: 800;
        }

        .notification.show {
            display: block;
        }

        .fmt-mini-panel {
            position: fixed;
            left: 22px;
            bottom: 22px;
            z-index: 6000;
            width: 360px;
            height: 420px;
            display: none;
            grid-template-rows: 1fr 1fr auto;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--workspace-border);
            border-radius: 8px;
            background: var(--popover-bg);
            box-shadow: 0 24px 60px rgba(20, 30, 45, 0.24);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }

        .fmt-mini-panel.show {
            display: grid;
        }

        .fmt-mini-textarea {
            width: 100%;
            height: 100%;
            min-height: 0;
            resize: none;
            overflow: auto;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.75;
            direction: rtl;
            text-align: right;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }

        .fmt-mini-textarea:focus {
            outline: none;
            border-color: rgba(31, 111, 235, 0.65);
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .fmt-mini-textarea::placeholder {
            color: var(--placeholder);
        }

        .fmt-mini-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .fmt-mini-process,
        .fmt-mini-copy,
        .fmt-mini-clear {
            width: 100%;
            min-height: 38px;
        }

        .fmt-mini-clear {
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.28);
            background: var(--danger-soft);
        }

        .fmt-focus-exit {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 6500;
            display: none;
            min-height: 36px;
            padding: 7px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--popover-bg);
            color: var(--text);
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
        }

        .fmt-focus-exit:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
            color: var(--accent-dark);
            box-shadow: var(--shadow-hover);
        }

        .fmt-focus-exit:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        body.fmt-focus-mode .fmt-wrapper {
            padding: 0;
        }

        body.fmt-focus-mode .fmt-container {
            height: 100vh;
            gap: 0;
        }

        body.fmt-focus-mode .fmt-header,
        body.fmt-focus-mode .fmt-panel-search,
        body.fmt-focus-mode .fmt-diff-center,
        body.fmt-focus-mode .fmt-panel-actions .fmt-icon-btn {
            display: none;
        }

        body.fmt-focus-mode .fmt-workspace {
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        body.fmt-focus-mode .fmt-grid {
            background: var(--surface);
        }

        body.fmt-focus-mode .fmt-panel-head {
            min-height: 34px;
            padding: 7px 28px;
            background: var(--surface);
            border-bottom-color: var(--border-subtle);
        }

        body.fmt-focus-mode .fmt-panel-actions {
            display: flex;
            justify-content: flex-end;
        }

        body.fmt-focus-mode .fmt-textarea {
            padding: 32px clamp(36px, 5vw, 72px) 90px;
            font-size: 18px;
            line-height: 2.05;
        }

        body.fmt-focus-mode .fmt-focus-exit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        body.fmt-focus-mode .fmt-mini-panel {
            display: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(50%, -10px);
            }

            to {
                opacity: 1;
                transform: translate(50%, 0);
            }
        }
    </style>
</head>
<body>

<div class="app-content">
    <div id="view-formatting" class="view-panel">
        <div class="fmt-wrapper">
            <div class="fmt-container">
                <header class="fmt-header">
                    <div class="fmt-header-right">
                        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="تبديل الوضع الداكن" title="تبديل الوضع الداكن">
                            <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"></path>
                            </svg>
                            <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2"></path>
                                <path d="M12 20v2"></path>
                                <path d="m4.9 4.9 1.4 1.4"></path>
                                <path d="m17.7 17.7 1.4 1.4"></path>
                                <path d="M2 12h2"></path>
                                <path d="M20 12h2"></path>
                                <path d="m6.3 17.7-1.4 1.4"></path>
                                <path d="m19.1 4.9-1.4 1.4"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="fmt-controls">
                        <button onclick="fmtProcess()" class="fmt-btn fmt-btn-primary">معالجة شاملة</button>
                        <button onclick="fmtRemoveBreaks()" class="fmt-btn">إزالة فواصل الأسطر</button>
                        <button onclick="fmtRemoveSpaces()" class="fmt-btn">إزالة المسافات الزائدة</button>
                        <button onclick="fmtCopy()" class="fmt-btn">نسخ النتيجة</button>
                        <button onclick="fmtClear()" class="fmt-btn fmt-btn-danger">مسح الكل</button>
                    </div>
                    <div class="fmt-header-left">
                        <button id="fmt-focus-mode" onclick="fmtToggleFocusMode()" class="fmt-btn" type="button" aria-pressed="false">وضع التركيز </button>
                        <button id="fmt-mini-mode" onclick="fmtToggleMiniMode()" class="fmt-btn" type="button" aria-pressed="false">نافذة صغيرة</button>
                        <button id="fmt-compare-mode" onclick="fmtCompareTexts()" class="fmt-btn" type="button" aria-pressed="false">مقارنة بين نصين</button>
                        <div class="app-copyright">محمد المحيميد 2026</div>
                    </div>
                </header>
                <main class="fmt-workspace">
                    <div class="fmt-grid">
                        <div class="fmt-diff-center">
                            <button id="fmt-diff-btn" onclick="fmtToggleDiff()" class="fmt-btn">معاينة التعديلات</button>
                            <button id="fmt-review-mode" onclick="fmtToggleReviewMode()" class="fmt-btn" type="button" aria-pressed="false">وضع المراجعة</button>
                            <span id="fmt-diff-count" class="fmt-diff-count">عدد التعديلات: 0</span>
                        </div>
                        <div class="fmt-box-group fmt-box-input">
                            <div class="fmt-panel-head">
                                <label id="fmt-input-label" for="fmt-input" class="fmt-label">النص الأصلي</label>
                                <div class="fmt-panel-actions">
                                    <button id="fmt-input-font-decrease" class="fmt-icon-btn fmt-font-btn" type="button" aria-label="تصغير الخط" title="تصغير الخط">−</button>
                                    <button id="fmt-input-font-increase" class="fmt-icon-btn fmt-font-btn" type="button" aria-label="تكبير الخط" title="تكبير الخط">+</button>
                                    <button id="fmt-input-undo" class="fmt-icon-btn" type="button" aria-label="تراجع" title="تراجع">
                                        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M9 14 4 9l5-5"></path>
                                            <path d="M4 9h10a6 6 0 0 1 0 12h-2"></path>
                                        </svg>
                                    </button>
                                    <button id="fmt-input-redo" class="fmt-icon-btn" type="button" aria-label="إعادة" title="إعادة">
                                        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="m15 14 5-5-5-5"></path>
                                            <path d="M20 9H10a6 6 0 0 0 0 12h2"></path>
                                        </svg>
                                    </button>
                                    <span id="fmt-input-count" class="fmt-meta">0 حرف  0 كلمة</span>
                                </div>
                            </div>
                            <div class="fmt-tool-group fmt-panel-search">
                                <label for="fmt-highlight-before" class="fmt-label">بحث</label>
                                <input id="fmt-highlight-before" class="fmt-input" type="text" placeholder="للبحث عن أكثر من كلمة أو رمز ضع فاصلة بينها، مثال: مهم,عاجل الرموز: (،)

                                ">
                            </div>
                            <div id="fmt-input" class="fmt-textarea" role="textbox" contenteditable="true" aria-labelledby="fmt-input-label" data-placeholder="الصق النص هنا..." data-raw-text=""></div>
                        </div>
                        <div class="fmt-box-group fmt-box-output">
                            <div class="fmt-panel-head">
                                <label id="fmt-output-label" for="fmt-output" class="fmt-label">النص بعد المعالجة</label>
                                <div class="fmt-panel-actions">
                                    <button id="fmt-output-font-decrease" class="fmt-icon-btn fmt-font-btn" type="button" aria-label="تصغير الخط" title="تصغير الخط">−</button>
                                    <button id="fmt-output-font-increase" class="fmt-icon-btn fmt-font-btn" type="button" aria-label="تكبير الخط" title="تكبير الخط">+</button>
                                    <button id="fmt-output-undo" class="fmt-icon-btn" type="button" aria-label="تراجع" title="تراجع">
                                        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M9 14 4 9l5-5"></path>
                                            <path d="M4 9h10a6 6 0 0 1 0 12h-2"></path>
                                        </svg>
                                    </button>
                                    <button id="fmt-output-redo" class="fmt-icon-btn" type="button" aria-label="إعادة" title="إعادة">
                                        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="m15 14 5-5-5-5"></path>
                                            <path d="M20 9H10a6 6 0 0 0 0 12h2"></path>
                                        </svg>
                                    </button>
                                    <span id="fmt-output-count" class="fmt-meta">0 حرف  0 كلمة</span>
                                </div>
                            </div>
                            <div class="fmt-tool-group fmt-panel-search">
                                <label for="fmt-highlight-after" class="fmt-label">بحث</label>
                                <input id="fmt-highlight-after" class="fmt-input" type="text" placeholder="للبحث عن أكثر من كلمة أو رمز ضع فاصلة بينها، مثال: مهم,عاجل الرموز: (،)

                                ">
                            </div>
                            <div id="fmt-output" class="fmt-textarea" role="textbox" contenteditable="true" aria-labelledby="fmt-output-label" data-raw-text=""></div>
                        </div>
                        <aside id="fmt-review-panel" class="fmt-review-panel" aria-hidden="true" aria-labelledby="fmt-review-title">
                            <div class="fmt-review-head">
                                <div class="fmt-review-title">
                                    <strong id="fmt-review-title">التعليقات التوضيحية</strong>
                                    <span id="fmt-review-summary" class="fmt-meta">0 مقترح</span>
                                </div>
                                <button id="fmt-review-close" class="fmt-icon-btn" type="button" aria-label="إغلاق وضع المراجعة" title="إغلاق وضع المراجعة">×</button>
                            </div>
                            <div class="fmt-review-actions">
                                <button id="fmt-review-accept-remaining" class="fmt-btn fmt-review-accept" type="button">قبول المتبقي</button>
                                <button id="fmt-review-reject-remaining" class="fmt-btn fmt-review-reject" type="button">رفض المتبقي</button>
                            </div>
                            <div id="fmt-review-list" class="fmt-review-list"></div>
                        </aside>
                    </div>
                </main>
            </div>
        </div>
    </div>
</div>

<div id="notify" class="notification">تم النسخ</div>
<button id="fmt-focus-exit" class="fmt-focus-exit" type="button" aria-hidden="true" aria-label="الخروج من وضع التركيز">الخروج من التركيز</button>
<div id="fmt-mini-panel" class="fmt-mini-panel" aria-hidden="true">
    <textarea id="fmt-mini-input" class="fmt-mini-textarea" placeholder="الصق السطر هنا..."></textarea>
    <textarea id="fmt-mini-output" class="fmt-mini-textarea" placeholder="النتيجة..."></textarea>
    <div class="fmt-mini-actions">
        <button id="fmt-mini-process" onclick="fmtProcessMini()" class="fmt-btn fmt-btn-primary fmt-mini-process" type="button">معالجة</button>
        <button id="fmt-mini-copy" onclick="fmtCopyMini()" class="fmt-btn fmt-mini-copy" type="button">نسخ النتيجة</button>

</div>

        <button type="button" id="fmt-edit-cancel" class="fmt-edit-btn fmt-edit-btn-secondary">إلغاء</button>
    </div>
</form>

<script>
    const fmtInput = document.getElementById('fmt-input');
    const fmtOutput = document.getElementById('fmt-output');
    const fmtInputCount = document.getElementById('fmt-input-count');
    const fmtOutputCount = document.getElementById('fmt-output-count');
    const fmtHighlightBefore = document.getElementById('fmt-highlight-before');
    const fmtHighlightAfter = document.getElementById('fmt-highlight-after');
    const fmtDiffBtn = document.getElementById('fmt-diff-btn');
    const fmtDiffCount = document.getElementById('fmt-diff-count');
    const fmtReviewModeBtn = document.getElementById('fmt-review-mode');
    const fmtReviewPanel = document.getElementById('fmt-review-panel');
    const fmtReviewSummary = document.getElementById('fmt-review-summary');
    const fmtReviewList = document.getElementById('fmt-review-list');

    async function fmtOpenMiniPip() {
        if (!('documentPictureInPicture' in window)) return false;
        try {
            fmtSetMiniMode(false);
            fmtMiniPipWindow = await window.documentPictureInPicture.requestWindow({
                width: 360,
                height: 420
            });
            fmtMiniPipWindow.document.open();
            fmtMiniPipWindow.document.write(fmtMiniDocumentHtml());
            fmtMiniPipWindow.document.close();
            fmtSetMiniButtonActive(true);

            const pipInput = fmtMiniPipWindow.document.getElementById('pip-input');
            const pipOutput = fmtMiniPipWindow.document.getElementById('pip-output');
            const pipProcess = fmtMiniPipWindow.document.getElementById('pip-process');
            const pipCopy = fmtMiniPipWindow.document.getElementById('pip-copy');
            const pipClear = fmtMiniPipWindow.document.getElementById('pip-clear');

            const processPipText = () => {
                const text = pipInput.value;
                if (!text.trim()) {
                    pipInput.focus();
                    showNotify('الرجاء لصق النص أولاً');
                    return;
                }
                pipOutput.value = fmtFormatText(text);
                showNotify('تمت المعالجة في النافذة');
            };
            const clearPipText = () => {
                pipInput.value = '';
                pipOutput.value = '';
                pipInput.focus();
                showNotify('تم مسح النافذة');
            };

            pipProcess.addEventListener('click', processPipText);
            pipCopy.addEventListener('click', () => fmtCopyMiniResult(pipOutput.value));
            pipClear.addEventListener('click', clearPipText);
            pipInput.addEventListener('keydown', event => {
                if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                    event.preventDefault();
                    processPipText();
                }
            });
            fmtMiniPipWindow.addEventListener('pagehide', () => {
                fmtMiniPipWindow = null;
                fmtSetMiniButtonActive(false);
            }, { once: true });
            pipInput.focus();
            return true;
        } catch (err) {
            fmtMiniPipWindow = null;
            fmtSetMiniButtonActive(false);
            return false;
        }
    }

    function fmtEscapeHtml(value) {
        return value.replace(/[&<>"']/g, ch => ({

            '<': '&lt;',

            '"': '&quot;',
            "'": '&#39;'
        })[ch]);

    function fmtEscapeRegExp(value) {
