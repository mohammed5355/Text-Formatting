<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنسيق النصوص</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --surface: #ffffff;
            --surface-muted: #f8fafc;
            --border: #dbe3ee;
            --text: #172033;
            --muted: #667085;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --shadow: 0 18px 50px rgba(20, 30, 55, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { min-height: 100%; background: var(--bg); }
        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(37, 99, 235, 0.12), transparent 32rem),
                linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
        }
        button, input, [contenteditable] { font: inherit; }
        .app-content { width: 100%; min-height: 100vh; }
        .view-panel { width: 100%; min-height: 100vh; display: block; }
        .fmt-wrapper {
            min-height: 100vh;
            overflow-y: auto;
            padding: 24px;
        }
        .fmt-container {
            width: min(1440px, 100%);
            min-height: calc(100vh - 48px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .fmt-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 4px 2px 2px;
        }
        .fmt-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text);
            font-size: clamp(24px, 3vw, 38px);
            font-weight: 800;
            line-height: 1.2;
        }
        .fmt-header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .fmt-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
        }
        .app-copyright {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .fmt-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(219, 227, 238, 0.9);
            border-radius: 8px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            overflow: hidden;
        }
        .fmt-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            min-height: clamp(640px, calc(100vh - 210px), 1040px);
        }
        .fmt-box-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--surface);
        }
        .fmt-box-group + .fmt-box-group { border-right: 1px solid var(--border); }
        .fmt-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 48px;
            padding: 11px 16px;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--border);
        }
        .fmt-label {
            font-weight: 800;
            color: var(--text);
            font-size: 15px;
        }
        .fmt-meta {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .fmt-textarea {
            width: 100%;
            flex: 1;
            min-height: 560px;
            overflow: auto;
            padding: 24px;
            border: 0;
            background: transparent;
            color: var(--text);
            line-height: 1.9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            transition: background-color 0.2s, box-shadow 0.2s;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .fmt-textarea:empty::before {
            content: attr(data-placeholder);
            color: #9aa6b2;
            pointer-events: none;
        }
        .fmt-textarea:focus {
            outline: none;
            background: #fbfdff;
            box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.22);
        }
        .fmt-textarea[aria-readonly="true"] { color: #1f2937; }
        .fmt-highlight,
        .fmt-diff {
            padding: 1px 4px;
            border-radius: 5px;
        }
        .fmt-highlight {
            background: #fef08a;
            box-shadow: inset 0 -1px 0 rgba(133, 77, 14, 0.2);
        }
        .fmt-diff {
            background: #bfdbfe;
            color: #1e3a8a;
            font-weight: 800;
            box-shadow: inset 0 -1px 0 rgba(30, 58, 138, 0.2);
        }
        .fmt-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: #ffffff;
            flex-wrap: wrap;
        }
        .fmt-tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }
        .fmt-panel-search {
            padding: 10px 14px;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--border);
        }
        .fmt-input {
            width: 100%;
            min-height: 36px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #ffffff;
            color: var(--text);
            font-size: 13px;
            direction: rtl;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .fmt-input:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.6);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .fmt-input::placeholder { color: #98a2b3; }
        .fmt-btn-active {
            border-color: rgba(37, 99, 235, 0.4);
            background: #eff6ff;
            color: var(--primary-dark);
        }
        .fmt-btn {
            min-height: 38px;
            padding: 7px 13px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
            color: var(--text);
            background: #ffffff;
        }
        .fmt-btn-primary {
            color: white;
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
        }
        .fmt-btn:hover {
            transform: translateY(-1px);
            border-color: #b8c5d8;
            box-shadow: 0 8px 18px rgba(20, 30, 55, 0.08);
        }
        .fmt-btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .fmt-btn-danger {
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.25);
        }
        .fmt-diff-count {
            display: none;
            align-items: center;
            min-height: 38px;
            padding: 7px 13px;
            border: 1px solid rgba(30, 58, 138, 0.25);
            border-radius: 7px;
            background: #eff6ff;
            color: #1e3a8a;
            font-size: 13px;
            font-weight: 800;
        }
        .fmt-diff-count.show { display: flex; }
        .notification {
            position: fixed;
            top: 22px;
            right: 50%;
            transform: translateX(50%);
            background: var(--success);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 14px 30px rgba(5, 150, 105, 0.22);
            display: none;
            animation: slideIn 0.22s ease;
            z-index: 2000;
            font-weight: 800;
        }
        .notification.show { display: block; }
        @keyframes slideIn {
            from { opacity: 0; transform: translate(50%, -10px); }
            to { opacity: 1; transform: translate(50%, 0); }
        }
        @media (max-width: 900px) {
            .fmt-wrapper { padding: 18px; }
            .fmt-container { min-height: auto; }
            .fmt-header { align-items: flex-start; flex-direction: column; }
            .fmt-logo { height: 40px; }
            .fmt-grid { grid-template-columns: 1fr; min-height: auto; }
            .fmt-box-group + .fmt-box-group {
                border-right: 0;
                border-top: 1px solid var(--border);
            }
            .fmt-textarea { min-height: 420px; }
            .fmt-controls { align-items: stretch; }
            .fmt-btn { flex: 1 1 calc(50% - 10px); }
            .fmt-btn-primary { flex-basis: 100%; }
        }
        @media (max-width: 520px) {
            .fmt-wrapper { padding: 12px; }
            .fmt-logo { height: 32px; }
            .fmt-panel-head { align-items: flex-start; flex-direction: column; }
            .fmt-textarea { min-height: 340px; padding: 16px; font-size: 15px; }
            .fmt-btn { flex-basis: 100%; }
            .notification { width: calc(100% - 24px); text-align: center; }
        }
    </style>
</head>
<body>

<div class="app-content">
    <div id="view-formatting" class="view-panel">
        <div class="fmt-wrapper">
            <div class="fmt-container">
                <header class="fmt-header">
                    <div class="fmt-header-right">
                        <img src="BOG_Logo.svg" alt="شعار" class="fmt-logo">
                        <h1 class="fmt-title">تنسيق النص</h1>
                    </div>
                    <div class="app-copyright">محمد المحيميد 2026</div>
                </header>
                <main class="fmt-workspace">
                    <div class="fmt-controls">
                        <button onclick="fmtProcess()" class="fmt-btn fmt-btn-primary">معالجة شاملة</button>
                        <button onclick="fmtRemoveBreaks()" class="fmt-btn">إزالة فواصل الأسطر</button>
                        <button onclick="fmtRemoveSpaces()" class="fmt-btn">إزالة المسافات الزائدة</button>
                        <button id="fmt-diff-btn" onclick="fmtToggleDiff()" class="fmt-btn">مشاهدة التغيرات</button>
                        <span id="fmt-diff-count" class="fmt-diff-count">عدد التغيرات: 0</span>
                        <button onclick="fmtCopy()" class="fmt-btn">نسخ النتيجة</button>
                        <button onclick="fmtClear()" class="fmt-btn fmt-btn-danger">مسح الكل</button>
                    </div>
                    <div class="fmt-grid">
                        <div class="fmt-box-group">
                            <div class="fmt-panel-head">
                                <label id="fmt-input-label" for="fmt-input" class="fmt-label">النص الأصلي</label>
                                <span id="fmt-input-count" class="fmt-meta">0 حرف</span>
                            </div>
                            <div class="fmt-tool-group fmt-panel-search">
                                <label for="fmt-highlight-before" class="fmt-label">بحث</label>
                                <input id="fmt-highlight-before" class="fmt-input" type="text" placeholder="مثال: مهم، عاجل">
                            </div>
                            <div id="fmt-input" class="fmt-textarea" role="textbox" contenteditable="true" aria-labelledby="fmt-input-label" data-placeholder="الصق النص هنا..."></div>
                        </div>
                        <div class="fmt-box-group">
                            <div class="fmt-panel-head">
                                <label id="fmt-output-label" for="fmt-output" class="fmt-label">النص بعد التنسيق</label>
                                <span id="fmt-output-count" class="fmt-meta">0 حرف</span>
                            </div>
                            <div class="fmt-tool-group fmt-panel-search">
                                <label for="fmt-highlight-after" class="fmt-label">بحث</label>
                                <input id="fmt-highlight-after" class="fmt-input" type="text" placeholder="مثال: مراجعة، نهائي">
                            </div>
                            <div id="fmt-output" class="fmt-textarea" role="textbox" contenteditable="true" aria-labelledby="fmt-output-label"></div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
</div>

<div id="notify" class="notification">تم النسخ</div>

<script>
    const fmtInput = document.getElementById('fmt-input');
    const fmtOutput = document.getElementById('fmt-output');
    const fmtInputCount = document.getElementById('fmt-input-count');
    const fmtOutputCount = document.getElementById('fmt-output-count');
    const fmtHighlightBefore = document.getElementById('fmt-highlight-before');
    const fmtHighlightAfter = document.getElementById('fmt-highlight-after');
    const fmtDiffBtn = document.getElementById('fmt-diff-btn');
    const fmtDiffCount = document.getElementById('fmt-diff-count');
    let fmtDiffEnabled = false;

    function fmtCountLabel(value) {
        return `${value.length.toLocaleString('ar-SA')} حرف`;
    }

    function fmtUpdateCounts() {
        fmtInputCount.textContent = fmtCountLabel(fmtGetText(fmtInput));
        fmtOutputCount.textContent = fmtCountLabel(fmtGetText(fmtOutput));
    }

    function fmtEscapeHtml(value) {
        return value.replace(/[&<>"']/g, ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[ch]);
    }

    function fmtEscapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function fmtSplitWords(value) {
        return value.split(/[,،]/).map(word => word.trim()).filter(Boolean);
    }

    function fmtGetText(el) {
        return el.innerText.replace(/\n$/, '');
    }

    function fmtSetPlainText(el, text) {
        el.textContent = text;
    }

    function fmtPastePlainText(event) {
        event.preventDefault();
        const text = event.clipboardData.getData('text/plain');
        if (!text) return;
        if (!document.execCommand('insertText', false, text)) {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createTextNode(text));
            range.collapse(false);
            selection.removeAllRanges();
            selection.addRange(range);
        }
        fmtUpdateCounts();
        fmtUpdateDiffCount();
    }

    function fmtDiffTerms(inputText, outputText) {
        if (!fmtDiffEnabled || !inputText || !outputText) return [];
        const sourceCounts = new Map();
        inputText.split(/\s+/).filter(Boolean).forEach(word => {
            const key = word.toLocaleLowerCase('ar-SA');
            sourceCounts.set(key, (sourceCounts.get(key) || 0) + 1);
        });
        const changed = [];
        outputText.split(/\s+/).filter(Boolean).forEach(word => {
            const key = word.toLocaleLowerCase('ar-SA');
            const count = sourceCounts.get(key) || 0;
            if (count > 0) {
                sourceCounts.set(key, count - 1);
            } else {
                changed.push(word);
            }
        });
        return changed;
    }

    function fmtDiffTotal() {
        if (!fmtDiffEnabled) return 0;
        const inputText = fmtGetText(fmtInput);
        const outputText = fmtGetText(fmtOutput);
        return fmtDiffTerms(outputText, inputText).length + fmtDiffTerms(inputText, outputText).length;
    }

    function fmtUpdateDiffCount() {
        const total = fmtDiffTotal();
        fmtDiffCount.textContent = `عدد التغيرات: ${total.toLocaleString('ar-SA')}`;
        fmtDiffCount.classList.toggle('show', fmtDiffEnabled);
    }

    function fmtTermsForBox(type) {
        const terms = [];
        const highlightSource = type === 'input' ? fmtHighlightBefore : fmtHighlightAfter;
        fmtSplitWords(highlightSource.value).forEach(word => terms.push({ word, type: 'highlight' }));
        if (type === 'input') {
            fmtDiffTerms(fmtGetText(fmtOutput), fmtGetText(fmtInput)).forEach(word => terms.push({ word, type: 'diff' }));
        }
        if (type === 'output') {
            fmtDiffTerms(fmtGetText(fmtInput), fmtGetText(fmtOutput)).forEach(word => terms.push({ word, type: 'diff' }));
        }
        const unique = [];
        const seen = new Set();
        terms
            .filter(item => item.word)
            .sort((a, b) => b.word.length - a.word.length)
            .forEach(item => {
                const key = item.word.toLocaleLowerCase('ar-SA');
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(item);
                }
            });
        return unique;
    }

    function fmtRenderBox(el, text, terms) {
        if (!text) {
            el.innerHTML = '';
            return;
        }
        if (!terms.length) {
            fmtSetPlainText(el, text);
            return;
        }
        const pattern = terms.map(item => fmtEscapeRegExp(item.word)).join('|');
        const termRegex = new RegExp(pattern, 'giu');
        let html = '';
        let lastIndex = 0;
        let match;
        while ((match = termRegex.exec(text)) !== null) {
            html += fmtEscapeHtml(text.slice(lastIndex, match.index));
            const item = terms.find(term => term.word.toLocaleLowerCase('ar-SA') === match[0].toLocaleLowerCase('ar-SA'));
            const className = item && item.type === 'diff' ? 'fmt-diff' : 'fmt-highlight';
            html += `<mark class="${className}">${fmtEscapeHtml(match[0])}</mark>`;
            lastIndex = match.index + match[0].length;
        }
        html += fmtEscapeHtml(text.slice(lastIndex));
        el.innerHTML = html;
    }

    function fmtRenderHighlights() {
        const inputText = fmtGetText(fmtInput);
        const outputText = fmtGetText(fmtOutput);
        if (document.activeElement !== fmtInput) {
            fmtRenderBox(fmtInput, inputText, fmtTermsForBox('input'));
        }
        if (document.activeElement !== fmtOutput) {
            fmtRenderBox(fmtOutput, outputText, fmtTermsForBox('output'));
        }
        fmtUpdateCounts();
        fmtUpdateDiffCount();
    }

    function fmtSetOutput(text) {
        fmtSetPlainText(fmtOutput, text);
        fmtRenderHighlights();
    }

    function fmtToggleDiff() {
        fmtDiffEnabled = !fmtDiffEnabled;
        fmtDiffBtn.classList.toggle('fmt-btn-active', fmtDiffEnabled);
        fmtRenderHighlights();
    }

    function showNotify(msg) {
        const n = document.getElementById('notify');
        n.textContent = msg;
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 2000);
    }

    function fmtProcess() {
        let t = fmtGetText(fmtInput);
        if (!t) return showNotify('الرجاء لصق النص أولاً');
        t = t.replace(/\n/g, " ");
        t = t.replace(/\s+([.,:;؟!])/g, '$1').replace(/(\(|\[|\{)\s+/g, '$1').replace(/\s+(\)|\]|\})/g, '$1').replace(/([\u0621-\u064A\u0671-\u06D3])\s*,\s*([\u0621-\u064A\u0671-\u06D3])/g, '$1، $2');
        t = t.replace(/[0-9۰-۹]/g, d => ({'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩','۰':'٠','۱':'١','۲':'٢','۳':'٣','۴':'٤','۵':'٥','۶':'٦','۷':'٧','۸':'٨','۹':'٩'})[d] || d);
        t = t.replace(new RegExp('([0-9\u0660-\u0669\u06F0-\u06F9]{1,3})(?:[,\u060C]([0-9\u0660-\u0669\u06F0-\u06F9]{1,3}))+', 'g'), function(m) {
            var parts = m.split(/[,\u060C]/);
            var first = parts[0], last = parts[parts.length - 1];
            if (first.length < 3 && parts.slice(1).every(function(p) { return p.length === 3; })) return m;
            var rev = parts.slice().reverse();
            var revCorrect = rev[0].length < 3 && rev.slice(1).every(function(p) { return p.length === 3; });
            if (revCorrect) {
                var sep = m.match(/[,\u060C]/)[0];
                return rev.join(sep);
            }
            var zeroChars = '0\u0660\u06F0';
            if (parts.length >= 2 && first.length === 3 && last.length === 3) {
                if (zeroChars.indexOf(first[0]) !== -1 && zeroChars.indexOf(last[0]) === -1) {
                    var sep = m.match(/[,\u060C]/)[0];
                    return parts.reverse().join(sep);
                }
            }
            return m;
        });
        const digit = '[0-9\u0660-\u0669\u06F0-\u06F9]';
        t = t.replace(new RegExp(`(${digit}{4})([-/])(${digit}{1,2})([-/])(${digit}{1,2})`, 'g'), (m,y,s1,mo,s2,d) => {
            const yn = y.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            const dn = d.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            return (parseInt(yn)>31 && parseInt(dn)<=31) ? d+s1+mo+s2+y : m;
        });
        const dates = [], placeholders = [];
        t = t.replace(new RegExp(`${digit}+[-/]${digit}+[-/]${digit}+`, 'g'), m => {
            const p = `__D_${dates.length}__`; dates.push(m); placeholders.push(p); return p;
        });
        t = t.replace(new RegExp(`(${digit}+)([-/\\\\])(${digit}+)`, 'g'), (m,n1,s,n2) => n2+s+n1);
        placeholders.forEach((p,i) => t = t.replace(p, dates[i]));
        fmtSetOutput(t.replace(/\s+/g, " ").trim());
    }

    function fmtRemoveBreaks() {
        fmtSetOutput(fmtGetText(fmtInput).replace(/\n/g, " ").replace(/\s+/g, " ").trim());
    }

    function fmtRemoveSpaces() {
        fmtSetOutput(fmtGetText(fmtInput).replace(/\s+/g, " ").trim());
    }

    async function fmtCopy() {
        const text = fmtGetText(fmtOutput);
        if(!text) return showNotify('لا يوجد نص');
        try {
            await navigator.clipboard.writeText(text);
        } catch (err) {
            const range = document.createRange();
            range.selectNodeContents(fmtOutput);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
            selection.removeAllRanges();
        }
        showNotify('تم النسخ');
    }

    function fmtClear() {
        fmtInput.innerHTML = '';
        fmtOutput.innerHTML = '';
        fmtHighlightBefore.value = '';
        fmtHighlightAfter.value = '';
        fmtUpdateCounts();
    }

    fmtInput.addEventListener('blur', fmtRenderHighlights);
    fmtInput.addEventListener('input', fmtUpdateCounts);
    fmtInput.addEventListener('paste', fmtPastePlainText);
    fmtOutput.addEventListener('blur', fmtRenderHighlights);
    fmtOutput.addEventListener('input', fmtUpdateCounts);
    fmtOutput.addEventListener('paste', fmtPastePlainText);
    fmtHighlightBefore.addEventListener('input', fmtRenderHighlights);
    fmtHighlightAfter.addEventListener('input', fmtRenderHighlights);
    fmtUpdateCounts();
</script>
</body>
</html>
