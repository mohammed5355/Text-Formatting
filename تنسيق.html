    function fmtSyncScroll(source, target) {
        if (!fmtDiffEnabled) return;
        if (fmtSyncingScroll) return;
        const sourceMax = source.scrollHeight - source.clientHeight;
        const targetMax = target.scrollHeight - target.clientHeight;
        if (sourceMax <= 0 || targetMax <= 0) return;
        fmtSyncingScroll = true;
        target.scrollTop = (source.scrollTop / sourceMax) * targetMax;
        requestAnimationFrame(() => {
            fmtSyncingScroll = false;
        });
    }

    function fmtMoveCaretToEnd(el) {
        el.focus();
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    function getCaretOffset(element) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return 0;

        const range = selection.getRangeAt(0);
        if (!element.contains(range.startContainer)) return 0;

        let offset = 0;
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
            if (node === range.startContainer) {
                return offset + range.startOffset;
            }
            offset += node.textContent.length;
        }

        return offset;
    }

    function setCaretOffset(element, offset) {
        element.focus();
        const selection = window.getSelection();
        const range = document.createRange();
        const targetOffset = Math.max(0, offset);
        let remaining = targetOffset;
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        let node;

        while ((node = walker.nextNode())) {
            const length = node.textContent.length;
            if (remaining <= length) {
                range.setStart(node, remaining);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
                return;
            }
            remaining -= length;
        }

        range.selectNodeContents(element);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    function fmtInitHistory(el, undoBtn, redoBtn) {
        fmtHistory.set(el, {
            undoStack: [fmtGetText(el)],
            redoStack: [],
            undoBtn,
            redoBtn,
            applying: false
        });
        fmtUpdateHistoryButtons(el);
    }

    function fmtUpdateHistoryButtons(el) {
        const state = fmtHistory.get(el);
        if (!state) return;
        state.undoBtn.disabled = state.undoStack.length <= 1;
        state.redoBtn.disabled = state.redoStack.length === 0;
    }

    function fmtRecordHistory(el) {
        const state = fmtHistory.get(el);
        if (!state || state.applying) return;
        const text = fmtGetText(el);
        if (state.undoStack[state.undoStack.length - 1] === text) {
            fmtUpdateHistoryButtons(el);
            return;
        }
        state.undoStack.push(text);
        if (state.undoStack.length > 100) state.undoStack.shift();
        state.redoStack = [];
        fmtUpdateHistoryButtons(el);
    }

    function fmtApplyHistory(el, text) {
        const state = fmtHistory.get(el);
        if (!state) return;
        state.applying = true;
        try {
            fmtSetPlainText(el, text);
            fmtRenderHighlights();
            fmtMoveCaretToEnd(el);
            fmtUpdateHistoryButtons(el);
        } finally {
            setTimeout(() => {
                state.applying = false;
            }, 0);
        }
    }

    function fmtUndo(el) {
        const state = fmtHistory.get(el);
        if (!state || state.undoStack.length <= 1) return;
        state.redoStack.push(state.undoStack.pop());
        fmtApplyHistory(el, state.undoStack[state.undoStack.length - 1]);
    }

    function fmtRedo(el) {
        const state = fmtHistory.get(el);
        if (!state || !state.redoStack.length) return;
        const text = state.redoStack.pop();
        state.undoStack.push(text);
        fmtApplyHistory(el, text);
    }

    function fmtPastePlainText(event) {
        event.preventDefault();
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        const text = event.clipboardData.getData('text/plain');
        if (!text) return;
        if (!document.execCommand('insertText', false, text)) {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            range.deleteContents();
            const textNode = document.createTextNode(text);
            range.insertNode(textNode);
            range.setStartAfter(textNode);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
        }
        fmtSyncRawText(event.currentTarget);
        fmtUpdateCounts();
        fmtUpdateDiffCount();
        fmtRecordHistory(event.currentTarget);
        fmtRenderHighlights();
    }

    function fmtTokenize(value) {
        const tokens = [];
        value.replace(/\S+/g, (word, index) => {
            tokens.push({
                word,
                key: word.toLocaleLowerCase('ar-SA'),
                start: index,
                end: index + word.length
            });
            return word;
        });
        return tokens;
    }

    function fmtBuildDiffPairs(inputText, outputText) {
        if (!fmtDiffEnabled || (!inputText && !outputText)) return [];
        const before = fmtTokenize(inputText);
        const after = fmtTokenize(outputText);
        if (!before.length && !after.length) return [];

        const rows = before.length + 1;
        const cols = after.length + 1;
        const table = Array.from({ length: rows }, () => Array(cols).fill(0));

        for (let i = before.length - 1; i >= 0; i--) {
            for (let j = after.length - 1; j >= 0; j--) {
                table[i][j] = before[i].key === after[j].key
                    ? table[i + 1][j + 1] + 1
                    : Math.max(table[i + 1][j], table[i][j + 1]);
            }
        }

        const pairs = [];
        let i = 0;
        let j = 0;
        let beforeRun = [];
        let afterRun = [];

        function flush() {
            if (!beforeRun.length && !afterRun.length) return;
            const id = pairs.length + 1;
            pairs.push({
                id,
                before: beforeRun.length ? {
                    start: beforeRun[0].start,
                    end: beforeRun[beforeRun.length - 1].end,
                    text: inputText.slice(beforeRun[0].start, beforeRun[beforeRun.length - 1].end)
                } : null,
                after: afterRun.length ? {
                    start: afterRun[0].start,
                    end: afterRun[afterRun.length - 1].end,
                    text: outputText.slice(afterRun[0].start, afterRun[afterRun.length - 1].end)
                } : null
            });
            beforeRun = [];
            afterRun = [];
        }

        while (i < before.length && j < after.length) {
            if (before[i].key === after[j].key) {
                flush();
                i++;
                j++;
            } else if (table[i + 1][j] >= table[i][j + 1]) {
                beforeRun.push(before[i]);
                i++;
            } else {
                afterRun.push(after[j]);
                j++;
            }
        }
        while (i < before.length) beforeRun.push(before[i++]);
        while (j < after.length) afterRun.push(after[j++]);
        flush();

        return pairs;
    }

    function fmtBuildReviewProposals(inputText, proposedText) {
        const before = fmtTokenize(inputText);
        const after = fmtTokenize(proposedText);
        if (inputText === proposedText) return [];

        const rows = before.length + 1;
        const cols = after.length + 1;
        const table = Array.from({ length: rows }, () => Array(cols).fill(0));

        for (let i = before.length - 1; i >= 0; i--) {
            for (let j = after.length - 1; j >= 0; j--) {
                table[i][j] = before[i].key === after[j].key
                    ? table[i + 1][j + 1] + 1
                    : Math.max(table[i + 1][j], table[i][j + 1]);
            }
        }

        const proposals = [];
        let i = 0;
        let j = 0;
        let beforeRun = [];
        let afterRun = [];
        let seenEqual = false;
        let lastBeforeEqualEnd = 0;
        let lastAfterEqualEnd = 0;

        function addProposal(start, end, beforeText, afterText) {
            proposals.push({
                id: proposals.length + 1,
                label: (proposals.length + 1).toLocaleString('ar-SA'),
                start,
                end,
                beforeText,
                afterText,
                type: !beforeText ? 'insert' : (!afterText ? 'delete' : 'replace'),
                status: 'active'
            });
        }

        function flush() {
            if (!beforeRun.length && !afterRun.length) return;
            const nextBeforeStart = i < before.length ? before[i].start : inputText.length;
            const nextAfterStart = j < after.length ? after[j].start : proposedText.length;
            const beforeStart = beforeRun.length ? beforeRun[0].start : nextBeforeStart;
            const beforeEnd = beforeRun.length ? Math.max(beforeRun[beforeRun.length - 1].end, nextBeforeStart) : beforeStart;
            const afterStart = afterRun.length ? afterRun[0].start : nextAfterStart;
            const afterEnd = afterRun.length ? Math.max(afterRun[afterRun.length - 1].end, nextAfterStart) : afterStart;
            const beforeText = beforeRun.length ? inputText.slice(beforeStart, beforeEnd) : '';
            const afterText = afterRun.length ? proposedText.slice(afterStart, afterEnd) : '';
            addProposal(beforeStart, beforeEnd, beforeText, afterText);
            beforeRun = [];
            afterRun = [];
        }

        while (i < before.length && j < after.length) {
            if (before[i].key === after[j].key) {
                if (beforeRun.length || afterRun.length) {
                    flush();
                } else {
                    const beforeGapStart = seenEqual ? lastBeforeEqualEnd : 0;
                    const afterGapStart = seenEqual ? lastAfterEqualEnd : 0;
                    const beforeGap = inputText.slice(beforeGapStart, before[i].start);
                    const afterGap = proposedText.slice(afterGapStart, after[j].start);
                    if (beforeGap !== afterGap) addProposal(beforeGapStart, before[i].start, beforeGap, afterGap);
                }
                seenEqual = true;
                lastBeforeEqualEnd = before[i].end;
                lastAfterEqualEnd = after[j].end;
                i++;
                j++;
            } else if (table[i + 1][j] >= table[i][j + 1]) {
                beforeRun.push(before[i]);
                i++;
            } else {
                afterRun.push(after[j]);
                j++;
            }
        }
        const hasPendingTailChange = beforeRun.length || afterRun.length || i < before.length || j < after.length;
        while (i < before.length) beforeRun.push(before[i++]);
        while (j < after.length) afterRun.push(after[j++]);
        flush();
        if (seenEqual && !hasPendingTailChange) {
            const beforeTail = inputText.slice(lastBeforeEqualEnd);
            const afterTail = proposedText.slice(lastAfterEqualEnd);
            if (beforeTail !== afterTail) addProposal(lastBeforeEqualEnd, inputText.length, beforeTail, afterTail);
        }

        if (!proposals.length && inputText !== proposedText) {
            proposals.push({
                id: 1,
                label: '١',
                start: 0,
                end: inputText.length,
                beforeText: inputText,
                afterText: proposedText,
                type: 'replace',
                status: 'active'
            });
        }

        return proposals;
    }

    function fmtActiveReviewProposals() {
        return fmtReviewProposals.filter(proposal => proposal.status === 'active');
    }

    function fmtReviewPreview(value) {
        const clean = value.replace(/\s+/g, ' ').trim();
        if (!clean && value.length) {
            const breaks = (value.match(/\n/g) || []).length;
            const length = value.length.toLocaleString('ar-SA');
            return breaks ? `${length} فراغ أو فاصل سطر` : `${length} مسافة`;
        }
        if (!clean) return 'لا شيء';
        return clean.length > 90 ? `${clean.slice(0, 90)}...` : clean;
    }

    function fmtReviewTypeLabel(proposal) {
        if (proposal.type === 'insert') return 'إضافة';
        if (proposal.type === 'delete') return 'حذف';
        return 'استبدال';
    }

    function fmtReviewReason(proposal) {
        const beforeText = proposal.beforeText;
        const afterText = proposal.afterText;
        if (proposal.type === 'insert') return 'إضافة جزء تقترحه المعالجة لتحسين اكتمال الصياغة.';
        if (proposal.type === 'delete') return 'حذف جزء زائد أو غير لازم بعد التنسيق.';
        if (/\n/.test(beforeText) && !/\n/.test(afterText)) return 'إزالة فاصل سطر داخل الجملة لتوحيد تدفق النص.';
        if (beforeText.replace(/\s+/g, ' ').trim() === afterText.replace(/\s+/g, ' ').trim() && beforeText !== afterText) {
            return 'تنظيم المسافات الزائدة دون تغيير المعنى.';
        }
        if (/[0-9۰-۹]/.test(beforeText) && /[\u0660-\u0669]/.test(afterText)) return 'توحيد شكل الأرقام إلى الصيغة العربية.';
        if (/[.,،:;؟!()[\]{}]/.test(beforeText + afterText)) return 'ضبط علامات الترقيم والمسافات المحيطة بها.';
        if (/[\\/-]/.test(beforeText + afterText)) return 'تصحيح ترتيب صيغة رقمية أو تاريخية.';
        return 'اقتراح لغوي ناتج عن المعالجة الشاملة للنص.';
    }

    function fmtReviewSegmentsForOutput() {
        if (!fmtReviewEnabled) return [];
        return fmtActiveReviewProposals().map(proposal => ({
            start: proposal.start,
            end: proposal.end,
            id: proposal.id,
            label: proposal.label,
            type: proposal.type
        }));
    }

    function fmtUpdateReviewUi() {
        document.body.classList.toggle('fmt-review-active', fmtReviewEnabled);
        fmtReviewModeBtn.classList.toggle('fmt-btn-active', fmtReviewEnabled);
        fmtReviewModeBtn.setAttribute('aria-pressed', String(fmtReviewEnabled));
        fmtReviewModeBtn.textContent = fmtReviewEnabled ? 'إنهاء المراجعة' : 'وضع المراجعة';
        fmtReviewPanel.setAttribute('aria-hidden', String(!fmtReviewEnabled));
    }

    function fmtRenderReviewPanel() {
        if (!fmtReviewEnabled) {
            fmtReviewSummary.textContent = '0 مقترح';
            fmtReviewList.innerHTML = '';
            fmtReviewAcceptRemaining.disabled = true;
            fmtReviewRejectRemaining.disabled = true;
            return;
        }
        const active = fmtActiveReviewProposals();
        const countLabel = active.length.toLocaleString('ar-SA');
        fmtReviewSummary.textContent = `${countLabel} مقترح متبق`;
        fmtReviewAcceptRemaining.disabled = !active.length;
        fmtReviewRejectRemaining.disabled = !active.length;

        if (!active.length) {
            fmtReviewList.innerHTML = '<div class="fmt-review-empty">تمت مراجعة كل المقترحات.</div>';
            return;
        }

        fmtReviewList.innerHTML = '';
        active.forEach(proposal => {
            const card = document.createElement('article');
            card.className = 'fmt-review-card';
            card.dataset.reviewCard = String(proposal.id);

            const head = document.createElement('div');
            head.className = 'fmt-review-card-head';
            const numberChip = document.createElement('span');
            numberChip.className = 'fmt-review-chip';
            numberChip.textContent = `#${proposal.label}`;
            const typeChip = document.createElement('span');
            typeChip.className = 'fmt-review-chip';
            typeChip.textContent = fmtReviewTypeLabel(proposal);
            head.append(numberChip, typeChip);

            const body = document.createElement('div');
            body.className = 'fmt-review-card-body';
            const reason = document.createElement('p');
            reason.className = 'fmt-review-reason';
            reason.textContent = fmtReviewReason(proposal);

            const beforeChange = document.createElement('div');
            beforeChange.className = 'fmt-review-change';
            const beforeLabel = document.createElement('span');
            beforeLabel.textContent = 'قبل';
            const beforeValue = document.createElement('strong');
            beforeValue.textContent = fmtReviewPreview(proposal.beforeText);
            beforeChange.append(beforeLabel, beforeValue);

            const afterChange = document.createElement('div');
            afterChange.className = 'fmt-review-change';
            const afterLabel = document.createElement('span');
            afterLabel.textContent = 'بعد';
            const afterValue = document.createElement('strong');
            afterValue.textContent = fmtReviewPreview(proposal.afterText);
            afterChange.append(afterLabel, afterValue);
            body.append(reason, beforeChange, afterChange);

            const actions = document.createElement('div');
            actions.className = 'fmt-review-card-actions';
            const acceptButton = document.createElement('button');
            acceptButton.className = 'fmt-btn fmt-review-accept';
            acceptButton.type = 'button';
            acceptButton.textContent = 'قبول';
            acceptButton.addEventListener('click', () => fmtAcceptReviewProposal(proposal.id));
            const rejectButton = document.createElement('button');
            rejectButton.className = 'fmt-btn fmt-review-reject';
            rejectButton.type = 'button';
            rejectButton.textContent = 'رفض';
            rejectButton.addEventListener('click', () => fmtRejectReviewProposal(proposal.id));
            actions.append(acceptButton, rejectButton);

            card.append(head, body, actions);
            fmtReviewList.appendChild(card);
        });
    }

    function fmtMarkActiveReview(id) {
        document.querySelectorAll('.fmt-review-mark, .fmt-review-anchor').forEach(mark => {
            mark.classList.toggle('fmt-review-mark-active', mark.dataset.reviewId === String(id));
        });
        document.querySelectorAll('.fmt-review-card').forEach(card => {
            card.classList.toggle('fmt-review-card-active', card.dataset.reviewCard === String(id));
        });
    }

    function fmtClearActiveReview() {
        document.querySelectorAll('.fmt-review-mark-active').forEach(mark => mark.classList.remove('fmt-review-mark-active'));
        document.querySelectorAll('.fmt-review-card-active').forEach(card => card.classList.remove('fmt-review-card-active'));
    }

    function fmtFocusReviewCard(id) {
        const card = fmtReviewList.querySelector(`[data-review-card="${id}"]`);
        if (!card) return;
        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        fmtMarkActiveReview(id);
    }

    function fmtBindReviewMarks() {
        document.querySelectorAll('.fmt-review-mark, .fmt-review-anchor').forEach(mark => {
            mark.addEventListener('mouseenter', () => fmtMarkActiveReview(mark.dataset.reviewId));
            mark.addEventListener('mouseleave', fmtClearActiveReview);
            mark.addEventListener('focus', () => fmtMarkActiveReview(mark.dataset.reviewId));
            mark.addEventListener('blur', fmtClearActiveReview);
            mark.addEventListener('mousedown', event => event.preventDefault());
            mark.addEventListener('click', event => {
                event.preventDefault();
                fmtFocusReviewCard(mark.dataset.reviewId);
            });
        });
    }

    function fmtShiftReviewRanges(changedProposal, delta) {
        const threshold = changedProposal.end;
        fmtReviewProposals.forEach(proposal => {
            if (proposal.id === changedProposal.id || proposal.status !== 'active') return;
            if (proposal.start >= threshold) {
                proposal.start += delta;
                proposal.end += delta;
            }
        });
    }

    function fmtCompleteReviewIfDone(message) {
        if (fmtActiveReviewProposals().length) return;
        fmtExitReviewMode(false);
        showNotify(message);
    }

    function fmtAcceptReviewProposal(id) {
        const proposal = fmtReviewProposals.find(item => item.id === id && item.status === 'active');
        if (!proposal) return;
        const text = fmtGetText(fmtOutput);
        const nextText = text.slice(0, proposal.start) + proposal.afterText + text.slice(proposal.end);
        const delta = proposal.afterText.length - (proposal.end - proposal.start);
        fmtSetPlainText(fmtOutput, nextText);
        proposal.status = 'accepted';
        fmtShiftReviewRanges(proposal, delta);
        fmtRecordHistory(fmtOutput);
        fmtRenderHighlights();
        fmtCompleteReviewIfDone('تم قبول كل المقترحات');
    }

    function fmtRejectReviewProposal(id) {
        const proposal = fmtReviewProposals.find(item => item.id === id && item.status === 'active');
        if (!proposal) return;
        proposal.status = 'rejected';
        fmtRenderHighlights();
        fmtCompleteReviewIfDone('انتهت مراجعة المقترحات');
    }

    function fmtAcceptRemainingReview() {
        const active = fmtActiveReviewProposals().sort((a, b) => b.start - a.start || b.end - a.end);
        if (!active.length) return;
        let text = fmtGetText(fmtOutput);
        active.forEach(proposal => {
            text = text.slice(0, proposal.start) + proposal.afterText + text.slice(proposal.end);
            proposal.status = 'accepted';
        });
        fmtSetPlainText(fmtOutput, text);
        fmtRecordHistory(fmtOutput);
        fmtExitReviewMode(false);
        showNotify('تم قبول كل المقترحات المتبقية');
    }

    function fmtRejectRemainingReview() {
        const active = fmtActiveReviewProposals();
        if (!active.length) return;
        active.forEach(proposal => {
            proposal.status = 'rejected';
        });
        fmtExitReviewMode(false);
        showNotify('تم رفض المقترحات المتبقية');
    }

    function fmtCreateReview(proposedText, message = 'تم إنشاء مقترحات المراجعة') {
        if (fmtCompareModeEnabled) {
            return showNotify('وضع المراجعة غير متاح أثناء المقارنة بين نصين');
        }
        const inputText = fmtGetText(fmtInput);
        if (!inputText.trim()) {
            fmtInput.focus();
            return showNotify('الرجاء لصق النص أولاً');
        }
        const proposals = fmtBuildReviewProposals(inputText, proposedText);
        if (!proposals.length) {
            fmtSetPlainText(fmtOutput, inputText);
            fmtRecordHistory(fmtOutput);
            fmtExitReviewMode(false);
            fmtRenderHighlights();
            return showNotify('لا توجد تعديلات مقترحة للمراجعة');
        }
        fmtReviewProposals = proposals;
        fmtReviewEnabled = true;
        fmtDiffEnabled = false;
        fmtDiffPairs = [];
        fmtDiffBtn.classList.remove('fmt-btn-active');
        fmtClearActiveDiff();
        fmtHideEditPopover();
        fmtSetPlainText(fmtOutput, inputText);
        fmtSetOutputEditable(false);
        fmtRecordHistory(fmtOutput);
        fmtUpdateReviewUi();
        fmtRenderHighlights();
        showNotify(message);
    }

    function fmtExitReviewMode(showMessage = true) {
        if (!fmtReviewEnabled && !fmtReviewProposals.length) {
            fmtUpdateReviewUi();
            fmtRenderReviewPanel();
            return;
        }
        fmtReviewEnabled = false;
        fmtReviewProposals = [];
        fmtSetOutputEditable(true);
        fmtClearActiveReview();
        fmtUpdateReviewUi();
        fmtRenderHighlights();
        if (showMessage) showNotify('تم إغلاق وضع المراجعة');
    }

    function fmtToggleReviewMode() {
        const now = Date.now();
        if (now - fmtReviewLastToggleAt < 450) return;
        fmtReviewLastToggleAt = now;
        if (fmtCompareModeEnabled) {
            return showNotify('أغلق وضع المقارنة أولاً لاستخدام المراجعة');
        }
        if (fmtReviewEnabled) {
            fmtExitReviewMode();
            return;
        }
        fmtCreateReview(fmtFormatText(fmtGetText(fmtInput)));
    }

    function fmtDiffTotal() {
        if (!fmtDiffEnabled) return 0;
        return fmtDiffPairs.length;
    }

    function fmtDiffChangePercent(inputText, outputText) {
        if (!fmtDiffEnabled) return 0;
        const inputWords = fmtTokenize(inputText);
        const outputWords = fmtTokenize(outputText);
        const totalWords = Math.max(inputWords.length, outputWords.length);
        if (!totalWords) return 0;
        const changedWords = fmtDiffPairs.reduce((sum, pair) => {
            const beforeCount = pair.before ? fmtTokenize(pair.before.text).length : 0;
            const afterCount = pair.after ? fmtTokenize(pair.after.text).length : 0;
            return sum + Math.max(beforeCount, afterCount);
        }, 0);
        return Math.min(100, Math.round((changedWords / totalWords) * 100));
    }

    function fmtUpdateDiffCount() {
        const inputText = fmtGetText(fmtInput);
        const outputText = fmtGetText(fmtOutput);
        if (fmtDiffEnabled) {
            fmtDiffPairs = fmtBuildDiffPairs(inputText, outputText);
        }
        const total = fmtDiffTotal();
        const percent = fmtDiffChangePercent(inputText, outputText).toLocaleString('ar-SA');
        const totalLabel = fmtCompareModeEnabled ? 'عدد الاختلافات' : 'عدد التعديلات';
        const percentLabel = fmtCompareModeEnabled ? 'نسبة الاختلافات' : 'نسبة التغيير';
        fmtDiffCount.textContent = `${totalLabel}: ${total.toLocaleString('ar-SA')} • ${percentLabel}: ${percent}٪`;
        fmtDiffCount.classList.toggle('show', fmtDiffEnabled);
    }

    function fmtDiffSegmentsForBox(type) {
        if (!fmtDiffEnabled) return [];
        return fmtDiffPairs
            .map(pair => {
                const side = type === 'input' ? pair.before : pair.after;
                if (!side) return null;
                return {
                    ...side,
                    id: pair.id,
                    label: pair.id.toLocaleString('ar-SA'),
                    side: type === 'input' ? 'before' : 'after'
                };
            })
            .filter(Boolean);
    }

    function fmtTermsForBox(type) {
        const terms = [];
        const highlightSource = type === 'input' ? fmtHighlightBefore : fmtHighlightAfter;
        fmtSplitWords(highlightSource.value).forEach(word => terms.push({ word, type: 'highlight' }));
        const unique = [];
        const seen = new Set();
        terms
            .filter(item => item.word)
            .sort((a, b) => b.word.length - a.word.length)
            .forEach(item => {
                const key = item.word.toLocaleLowerCase('ar-SA');
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(item);
                }
            });
        return unique;
    }

    function fmtRenderBox(el, text, terms, diffSegments = [], reviewSegments = []) {
        const shouldRestoreCaret = el === document.activeElement;
        const caretOffset = shouldRestoreCaret ? getCaretOffset(el) : 0;
        const restoreCaret = () => {
            if (shouldRestoreCaret) setCaretOffset(el, caretOffset);
        };
        el.dataset.rawText = text;

        if (!text) {
            el.innerHTML = '';
            restoreCaret();
            return;
        }
        if (!terms.length && !diffSegments.length && !reviewSegments.length) {
            fmtSetPlainText(el, text);
            restoreCaret();
            return;
        }
        const markers = [];
        reviewSegments.forEach(segment => {
            markers.push({
                start: segment.start,
                end: segment.end,
                type: segment.start === segment.end ? 'review-anchor' : 'review',
                id: segment.id,
                label: segment.label
            });
        });
        diffSegments.forEach(segment => {
            markers.push({
                start: segment.start,
                end: segment.end,
                type: 'diff',
                id: segment.id,
                label: segment.label,
                side: segment.side
            });
        });
        if (terms.length) {
            const pattern = terms.map(item => fmtEscapeRegExp(item.word)).join('|');
            const termRegex = new RegExp(pattern, 'giu');
            let match;
            while ((match = termRegex.exec(text)) !== null) {
                const coveredByDiff = diffSegments.some(segment => match.index < segment.end && match.index + match[0].length > segment.start);
                const coveredByReview = reviewSegments.some(segment => segment.start < segment.end && match.index < segment.end && match.index + match[0].length > segment.start);
                if (!coveredByDiff && !coveredByReview) {
                    markers.push({
                        start: match.index,
                        end: match.index + match[0].length,
                        type: 'highlight'
                    });
                }
            }
        }
        markers.sort((a, b) => a.start - b.start || b.end - a.end);
        let html = '';
        let lastIndex = 0;
        markers.forEach(marker => {
            if (marker.start < lastIndex) return;
            html += fmtEscapeHtml(text.slice(lastIndex, marker.start));
            if (marker.type === 'review-anchor') {
                html += `<span class="fmt-review-anchor" data-review-id="${marker.id}" data-review-label="${marker.label}" tabindex="0"></span>`;
                lastIndex = marker.start;
                return;
            }
            const value = fmtEscapeHtml(text.slice(marker.start, marker.end));
            if (marker.type === 'diff') {
                const sideClass = marker.side === 'before' ? 'fmt-diff-before' : 'fmt-diff-after';
                html += `<mark class="fmt-diff ${sideClass}" data-diff-id="${marker.id}" data-diff-label="${marker.label}" data-start="${marker.start}" data-end="${marker.end}" tabindex="0">${value}</mark>`;
            } else if (marker.type === 'review') {
                html += `<mark class="fmt-review-mark" data-review-id="${marker.id}" data-review-label="${marker.label}" data-start="${marker.start}" data-end="${marker.end}" tabindex="0">${value}</mark>`;
            } else {
                html += `<mark class="fmt-highlight" data-start="${marker.start}" data-end="${marker.end}" tabindex="0">${value}</mark>`;
            }
            lastIndex = marker.end;
        });
        html += fmtEscapeHtml(text.slice(lastIndex));
        el.innerHTML = html;
        restoreCaret();
    }

    function fmtMarkActiveDiff(id) {
        document.querySelectorAll('.fmt-diff').forEach(el => {
            el.classList.toggle('fmt-diff-active', el.dataset.diffId === String(id));
        });
    }

    function fmtClearActiveDiff() {
        document.querySelectorAll('.fmt-diff-active').forEach(el => el.classList.remove('fmt-diff-active'));
    }

    function fmtScrollDiffMate(id, currentEl) {
        const mate = Array.from(document.querySelectorAll(`.fmt-diff[data-diff-id="${id}"]`)).find(el => el !== currentEl);
        if (mate) mate.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function fmtHideEditPopover() {
        if (fmtEditObserver) {
            fmtEditObserver.disconnect();
            fmtEditObserver = null;
        }
        fmtEditTarget = null;
        fmtEditPopover.classList.remove('show');
    }

    function fmtHandleEditorBlur(event) {
        if (fmtEditPopover.contains(event.relatedTarget)) return;
        fmtRenderHighlights();
    }

    function fmtPositionEditPopover(mark) {
        const rect = mark.getBoundingClientRect();
        const margin = 12;
        const width = Math.min(360, window.innerWidth - margin * 2);
        fmtEditPopover.style.width = `${width}px`;
        const top = Math.min(window.innerHeight - fmtEditPopover.offsetHeight - margin, rect.bottom + 8);
        const left = Math.min(window.innerWidth - width - margin, Math.max(margin, rect.left + (rect.width / 2) - (width / 2)));
        fmtEditPopover.style.top = `${Math.max(margin, top)}px`;
        fmtEditPopover.style.left = `${left}px`;
    }

    function fmtShowEditPopover(mark) {
        const box = mark.closest('.fmt-textarea');
        if (!box) return;
        if (fmtEditObserver) {
            fmtEditObserver.disconnect();
            fmtEditObserver = null;
        }
        fmtEditTarget = {
            box,
            start: Number(mark.dataset.start),
            end: Number(mark.dataset.end)
        };
        fmtEditInput.value = mark.innerText;
        fmtEditPopover.classList.add('show');
        fmtPositionEditPopover(mark);
        fmtEditInput.focus();
        fmtEditInput.select();
        fmtEditObserver = new IntersectionObserver(entries => {
            if (!entries[0].isIntersecting) {
                fmtHideEditPopover();
            }
        });
        fmtEditObserver.observe(mark);
    }

    function fmtReplaceEditTarget() {
        if (!fmtEditTarget) return;
        const { box, start, end } = fmtEditTarget;
        const text = fmtGetText(box);
        const replacement = fmtEditInput.value;
        fmtSetPlainText(box, text.slice(0, start) + replacement + text.slice(end));
        fmtRecordHistory(box);
        fmtHideEditPopover();
        fmtRenderHighlights();
        showNotify('تم الاستبدال');
    }

    function fmtBindDiffMarks() {
        document.querySelectorAll('.fmt-diff').forEach(mark => {
            mark.addEventListener('mouseenter', () => fmtMarkActiveDiff(mark.dataset.diffId));
            mark.addEventListener('mouseleave', fmtClearActiveDiff);
            mark.addEventListener('focus', () => fmtMarkActiveDiff(mark.dataset.diffId));
            mark.addEventListener('blur', fmtClearActiveDiff);
            mark.addEventListener('mousedown', event => event.preventDefault());
            mark.addEventListener('click', event => {
                event.preventDefault();
                fmtShowEditPopover(mark);
            });
        });
        document.querySelectorAll('.fmt-highlight').forEach(mark => {
            mark.addEventListener('mousedown', event => event.preventDefault());
            mark.addEventListener('click', event => {
                event.preventDefault();
                fmtShowEditPopover(mark);
            });
        });
    }

    function fmtRenderHighlights() {
        const inputText = fmtGetText(fmtInput);
        const outputText = fmtGetText(fmtOutput);
        fmtDiffPairs = fmtBuildDiffPairs(inputText, outputText);
        fmtRenderBox(fmtInput, inputText, fmtTermsForBox('input'), fmtDiffSegmentsForBox('input'));
        fmtRenderBox(fmtOutput, outputText, fmtTermsForBox('output'), fmtDiffSegmentsForBox('output'), fmtReviewSegmentsForOutput());
        fmtBindDiffMarks();
        fmtBindReviewMarks();
        fmtRenderReviewPanel();
        fmtUpdateCounts();
        fmtUpdateDiffCount();
    }

    function fmtSetOutput(text) {
        fmtSetPlainText(fmtOutput, text);
        fmtRecordHistory(fmtOutput);
        fmtRenderHighlights();
    }

    function fmtToggleDiff() {
        if (fmtCompareModeEnabled) {
            fmtCompareTexts(false);
            return;
        }
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        if (!fmtDiffEnabled && (!fmtGetText(fmtInput).trim() || !fmtGetText(fmtOutput).trim())) return;
        fmtDiffEnabled = !fmtDiffEnabled;
        fmtDiffBtn.classList.toggle('fmt-btn-active', fmtDiffEnabled);
        if (!fmtDiffEnabled) {
            fmtClearActiveDiff();
            fmtHideEditPopover();
        }
        fmtRenderHighlights();
    }

    function fmtCompareTexts(allowClose = true) {
        if (allowClose && fmtCompareModeEnabled) {
            fmtExitCompareMode();
            return;
        }
        fmtSetCompareMode(true);
        const inputText = fmtGetText(fmtInput).trim();
        const outputText = fmtGetText(fmtOutput).trim();
        if (!inputText || !outputText) {
            fmtDiffEnabled = false;
            fmtDiffBtn.classList.remove('fmt-btn-active');
            fmtClearActiveDiff();
            fmtHideEditPopover();
            fmtRenderHighlights();
            if (!inputText) {
                fmtInput.focus();
            } else {
                fmtOutput.focus();
            }
            return showNotify('الصق النصين أولاً ثم اضغط تحديث المقارنة');
        }
        fmtDiffEnabled = true;
        fmtDiffBtn.classList.add('fmt-btn-active');
        fmtRenderHighlights();
    }

    function showNotify(msg) {
        const n = document.getElementById('notify');
        n.textContent = msg;
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 2000);
    }

    function fmtFormatText(text) {
        let t = text;
        t = t.replace(/\n/g, " ");
        t = t.replace(/\s+([.,:;؟!])/g, '$1').replace(/(\(|\[|\{)\s+/g, '$1').replace(/\s+(\)|\]|\})/g, '$1').replace(/([\u0621-\u064A\u0671-\u06D3])\s*,\s*([\u0621-\u064A\u0671-\u06D3])/g, '$1، $2');
        t = t.replace(/[0-9۰-۹]/g, d => ({'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩','۰':'٠','۱':'١','۲':'٢','۳':'٣','۴':'٤','۵':'٥','۶':'٦','۷':'٧','۸':'٨','۹':'٩'})[d] || d);
        t = t.replace(new RegExp('([0-9\u0660-\u0669\u06F0-\u06F9]{1,3})(?:[,\u060C]([0-9\u0660-\u0669\u06F0-\u06F9]{1,3}))+', 'g'), function(m) {
            var parts = m.split(/[,\u060C]/);
            var first = parts[0], last = parts[parts.length - 1];
            if (first.length < 3 && parts.slice(1).every(function(p) { return p.length === 3; })) return m;
            var rev = parts.slice().reverse();
            var revCorrect = rev[0].length < 3 && rev.slice(1).every(function(p) { return p.length === 3; });
            if (revCorrect) {
                var sep = m.match(/[,\u060C]/)[0];
                return rev.join(sep);
            }
            var zeroChars = '0\u0660\u06F0';
            if (parts.length >= 2 && first.length === 3 && last.length === 3) {
                if (zeroChars.indexOf(first[0]) !== -1 && zeroChars.indexOf(last[0]) === -1) {
                    var sep = m.match(/[,\u060C]/)[0];
                    return parts.reverse().join(sep);
                }
            }
            return m;
        });
        const digit = '[0-9\u0660-\u0669\u06F0-\u06F9]';
        t = t.replace(new RegExp(`(${digit}{4})([-/])(${digit}{1,2})([-/])(${digit}{1,2})`, 'g'), (m,y,s1,mo,s2,d) => {
            const yn = y.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            const dn = d.replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => ({'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}[d]||d));
            return (parseInt(yn)>31 && parseInt(dn)<=31) ? d+s1+mo+s2+y : m;
        });
        const dates = [], placeholders = [];
        t = t.replace(new RegExp(`${digit}+[-/]${digit}+[-/]${digit}+`, 'g'), m => {
            const p = `__D_${dates.length}__`; dates.push(m); placeholders.push(p); return p;
        });
        t = t.replace(new RegExp(`(${digit}+)([-/\\\\])(${digit}+)`, 'g'), (m,n1,s,n2) => n2+s+n1);
        placeholders.forEach((p,i) => t = t.replace(p, dates[i]));
        return t.replace(/\s+/g, " ").trim();
    }

    function fmtApplyMainTransform(transformFn) {
        fmtSetCompareMode(false);
        const text = fmtGetText(fmtInput);
        if (!text) return showNotify('الرجاء لصق النص أولاً');
        const proposedText = transformFn(text);
        if (fmtReviewEnabled) {
            fmtCreateReview(proposedText, 'تم تحديث مقترحات المراجعة');
            return;
        }
        fmtSetOutput(proposedText);
    }

    function fmtProcess() {
        fmtApplyMainTransform(fmtFormatText);
    }

    function fmtProcessMini() {
        const text = fmtMiniInput.value;
        if (!text.trim()) {
            fmtMiniInput.focus();
            return showNotify('الرجاء لصق النص أولاً');
        }
        fmtMiniOutput.value = fmtFormatText(text);
        showNotify('تمت المعالجة');
    }

    async function fmtCopyMiniResult(text) {
        if (!text) return showNotify('لا توجد نتيجة لنسخها');
        try {
            await navigator.clipboard.writeText(text);
        } catch (err) {
            const helper = document.createElement('textarea');
            helper.value = text;
            helper.style.position = 'fixed';
            helper.style.opacity = '0';
            document.body.appendChild(helper);
            helper.select();
            document.execCommand('copy');
            helper.remove();
        }
        showNotify('تم نسخ النتيجة');
    }

    function fmtCopyMini() {
        fmtCopyMiniResult(fmtMiniOutput.value);
    }

    function fmtClearMini() {
        fmtMiniInput.value = '';
        fmtMiniOutput.value = '';
        fmtMiniInput.focus();
    }

    function fmtRemoveBreaks() {
        fmtApplyMainTransform(text => text.replace(/\n/g, " ").replace(/\s+/g, " ").trim());
    }

    function fmtRemoveSpaces() {
        fmtApplyMainTransform(text => text.replace(/\s+/g, " ").trim());
    }

    async function fmtCopy() {
        const text = fmtGetText(fmtOutput);
        if(!text) return showNotify('لا يوجد نص');
        try {
            await navigator.clipboard.writeText(text);
        } catch (err) {
            const range = document.createRange();
            range.selectNodeContents(fmtOutput);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
            selection.removeAllRanges();
        }
        showNotify('تم النسخ');
    }

    function fmtClear() {
        fmtExitReviewMode(false);
        fmtSetPlainText(fmtInput, '');
        fmtSetPlainText(fmtOutput, '');
        fmtHighlightBefore.value = '';
        fmtHighlightAfter.value = '';
        fmtDiffPairs = [];
        fmtDiffEnabled = false;
        fmtSetCompareMode(false);
        fmtDiffBtn.classList.remove('fmt-btn-active');
        fmtClearActiveDiff();
        fmtHideEditPopover();
        fmtRecordHistory(fmtInput);
        fmtRecordHistory(fmtOutput);
        fmtUpdateCounts();
        fmtUpdateDiffCount();
    }

    const fmtUpdateDiffCountDebounced = fmtDebounce(fmtUpdateDiffCount, 300);
    const fmtRecordInputHistoryDebounced = fmtDebounce(() => fmtRecordHistory(fmtInput), 500);
    const fmtRecordOutputHistoryDebounced = fmtDebounce(() => fmtRecordHistory(fmtOutput), 500);

    fmtEditPopover.addEventListener('submit', event => {
        event.preventDefault();
        fmtReplaceEditTarget();
    });
    fmtEditCancel.addEventListener('click', fmtHideEditPopover);
    document.addEventListener('click', event => {
        if (!fmtEditPopover.classList.contains('show')) return;
        if (fmtEditPopover.contains(event.target) || event.target.closest('.fmt-diff, .fmt-highlight')) return;
        fmtHideEditPopover();
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
            fmtHideEditPopover();
            if (fmtMiniPanel.classList.contains('show')) fmtSetMiniMode(false);
            if (document.body.classList.contains('fmt-focus-mode')) fmtSetFocusMode(false);
            if (fmtReviewEnabled) fmtExitReviewMode();
        }
    });
    window.addEventListener('resize', fmtHideEditPopover);
    fmtInitHistory(fmtInput, fmtInputUndo, fmtInputRedo);
    fmtInitHistory(fmtOutput, fmtOutputUndo, fmtOutputRedo);
    fmtInitFontControls(fmtInput, fmtInputFontDecrease, fmtInputFontIncrease);
    fmtInitFontControls(fmtOutput, fmtOutputFontDecrease, fmtOutputFontIncrease);
    fmtInputFontDecrease.addEventListener('click', () => fmtChangeFontSize(fmtInput, -1));
    fmtInputFontIncrease.addEventListener('click', () => fmtChangeFontSize(fmtInput, 1));
    fmtOutputFontDecrease.addEventListener('click', () => fmtChangeFontSize(fmtOutput, -1));
    fmtOutputFontIncrease.addEventListener('click', () => fmtChangeFontSize(fmtOutput, 1));
    fmtInputUndo.addEventListener('click', () => {
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        fmtUndo(fmtInput);
    });
    fmtInputRedo.addEventListener('click', () => {
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        fmtRedo(fmtInput);
    });
    fmtOutputUndo.addEventListener('click', () => {
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        fmtUndo(fmtOutput);
    });
    fmtOutputRedo.addEventListener('click', () => {
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        fmtRedo(fmtOutput);
    });
    fmtInput.addEventListener('blur', fmtHandleEditorBlur);
    fmtInput.addEventListener('input', () => {
        fmtSyncRawText(fmtInput);
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        fmtUpdateCounts();
        fmtUpdateDiffCountDebounced();
        fmtRecordInputHistoryDebounced();
    });
    fmtInput.addEventListener('paste', fmtPastePlainText);
    fmtInput.addEventListener('scroll', () => fmtSyncScroll(fmtInput, fmtOutput));
    fmtOutput.addEventListener('blur', fmtHandleEditorBlur);
    fmtOutput.addEventListener('input', () => {
        fmtSyncRawText(fmtOutput);
        if (fmtReviewEnabled) fmtExitReviewMode(false);
        fmtUpdateCounts();
        fmtUpdateDiffCountDebounced();
        fmtRecordOutputHistoryDebounced();
    });
    fmtOutput.addEventListener('paste', fmtPastePlainText);
    fmtOutput.addEventListener('scroll', () => fmtSyncScroll(fmtOutput, fmtInput));
    fmtMiniInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
            event.preventDefault();
            fmtProcessMini();
        }
    });
    fmtHighlightBefore.addEventListener('input', fmtRenderHighlights);
    fmtHighlightAfter.addEventListener('input', fmtRenderHighlights);
    fmtReviewAcceptRemaining.addEventListener('click', fmtAcceptRemainingReview);
    fmtReviewRejectRemaining.addEventListener('click', fmtRejectRemainingReview);
    fmtReviewClose.addEventListener('click', () => fmtExitReviewMode());
    fmtFocusExitBtn.addEventListener('click', () => fmtSetFocusMode(false));
    themeToggle.addEventListener('click', fmtToggleTheme);
    fmtSetTheme(fmtLoadTheme());
    fmtUpdateCounts();
</script>
</body>
</html>
